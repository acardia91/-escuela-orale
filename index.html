<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Escuela Órale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--tinta:#17140F;--hueso:#F5F2EC;--papel:#FFF;--borde:#E2DCD1;--borde2:#D5CDBF;
--gris:#6E675C;--gris2:#9C948A;--vino:#7B1D3A;--roja:#C1272D;--naranja:#D97A1E;--verde:#4A7C2F;
--azul:#1B5E9E;--amarillo:#D89B1C;--marron:#7A5230;--morado:#6B4A8C;--teal:#1F6F6B;
--ok:#3F7A2A;--alerta:#B4531A;--mal:#C1272D;--s:0 1px 2px rgba(23,20,15,.04),0 2px 8px rgba(23,20,15,.03)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--hueso);color:var(--tinta);line-height:1.5;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:left}
input,textarea,select{font-family:inherit}

#login{position:fixed;inset:0;background:var(--tinta);z-index:300;overflow-y:auto;padding:26px 18px}
.lc{text-align:center;margin-bottom:22px}
.lc .m{font-family:'Archivo';font-variation-settings:'wdth' 112,'wght' 900;font-size:21px;color:var(--hueso);text-transform:uppercase;margin-bottom:4px}
.lc .m span{color:var(--amarillo)}
.lc p{color:rgba(245,242,236,.45);font-size:13px}
.locs{display:flex;gap:7px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.locs::-webkit-scrollbar{display:none}
.locb{flex-shrink:0;padding:9px 16px;border-radius:100px;font-size:13px;font-weight:600;background:rgba(255,255,255,.08);color:rgba(245,242,236,.65)}
.locb[aria-pressed="true"]{background:var(--amarillo);color:var(--tinta)}
.emps{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:460px;margin:0 auto}
.emp{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.11);border-radius:13px;padding:14px 13px;position:relative}
.emp .i{width:32px;height:32px;border-radius:9px;background:var(--col);color:var(--tinta);display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-variation-settings:'wght' 800;font-size:13px;margin-bottom:9px}
.emp strong{display:block;color:var(--hueso);font-size:14px}
.emp small{color:rgba(245,242,236,.42);font-size:11.5px;text-transform:capitalize}
.emp .pend{position:absolute;top:11px;right:11px;background:var(--roja);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px}
.dir{margin:18px auto 0;max-width:460px;background:rgba(255,255,255,.05);border:1.5px dashed rgba(255,255,255,.18);border-radius:13px;padding:14px;text-align:center;color:rgba(245,242,236,.6);font-size:13px;font-weight:600;display:block;width:100%}
.pinw{max-width:290px;margin:0 auto;text-align:center}
.pinw h2{font-family:'Archivo';font-variation-settings:'wdth' 108,'wght' 800;font-size:21px;color:var(--hueso);margin-bottom:3px}
.pinw .s{color:rgba(245,242,236,.45);font-size:13px;margin-bottom:22px}
.dots{display:flex;gap:12px;justify-content:center;margin-bottom:26px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.28)}
.dot.on{background:var(--amarillo);border-color:var(--amarillo)}
.dot.err{background:var(--mal);border-color:var(--mal)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{aspect-ratio:1.5;background:rgba(255,255,255,.08);border-radius:13px;color:var(--hueso);font-family:'Archivo';font-variation-settings:'wght' 700;font-size:22px;text-align:center;display:flex;align-items:center;justify-content:center}
.pad .t{font-family:'Inter';font-size:12.5px;font-weight:600;color:rgba(245,242,236,.55)}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:sh .3s}

.top{position:sticky;top:0;z-index:50;background:var(--tinta);padding:12px 16px}
.tr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .i{width:32px;height:32px;border-radius:9px;background:var(--amarillo);color:var(--tinta);display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-variation-settings:'wght' 800;font-size:13px;flex-shrink:0}
.who strong{display:block;color:var(--hueso);font-size:14px;line-height:1.2}
.who small{color:rgba(245,242,236,.42);font-size:11.5px}
.salir{background:rgba(255,255,255,.09);color:rgba(245,242,236,.75);padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600}
.tabs{display:flex;gap:6px;margin-top:11px}
.tab{flex:1;padding:9px;border-radius:9px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.07);color:rgba(245,242,236,.55);text-align:center}
.tab[aria-pressed="true"]{background:var(--hueso);color:var(--tinta)}

.wrap{padding:16px 16px 100px;max-width:1000px;margin:0 auto}
.eye{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gris2);margin:24px 0 11px;display:flex;justify-content:space-between}
.eye:first-child{margin-top:0}
.eye b{color:var(--gris)}

/* QUINCENA HERO */
/* ETIQUETAS DE PLAZO */
.pl{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pl-venc{background:#7A1418;color:#fff}
.pl-urg{background:#FDECEC;color:var(--mal)}
.pl-med{background:#FEF4E9;color:var(--alerta)}
.pl-ok{background:#EEF4FA;color:var(--azul)}
.pl-neu{background:#F0EDE7;color:var(--gris2)}
.pl-hecho{background:#EAF3E4;color:var(--ok)}
.pl-marc{background:var(--vino);color:#fff}
.pl svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}

.mod-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.mod-h strong{flex:1;min-width:0}

/* MARCADO POR ENCARGADO */
.marc{background:#FDF4F6;border:1.5px solid #E8C4CF;border-left:5px solid var(--vino);border-radius:12px;padding:13px 14px;margin-bottom:9px}
.marc .mk{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--vino);margin-bottom:5px}
.marc strong{display:block;font-size:14.5px;font-weight:600;margin-bottom:4px;line-height:1.3}
.marc p{font-size:12.5px;color:var(--gris);line-height:1.5;font-style:italic}
.marc .de{font-size:11.5px;color:var(--gris2);margin-top:6px;font-style:normal}

/* GRUPOS CON % */
.grp{background:var(--papel);border:1.5px solid var(--borde);border-radius:13px;padding:14px;margin-bottom:9px;box-shadow:var(--s);width:100%;position:relative;overflow:hidden}
.grp::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--col)}
.grp .gh{display:flex;align-items:center;gap:11px;margin-bottom:10px;margin-left:4px}
.grp .ic{width:32px;height:32px;border-radius:9px;background:var(--col);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.grp .ic svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.grp .gb{flex:1;min-width:0}
.grp .gb strong{display:block;font-family:'Archivo';font-variation-settings:'wdth' 105,'wght' 700;font-size:14.5px;line-height:1.2}
.grp .gb small{font-size:11.5px;color:var(--gris2)}
.grp .gp{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:19px;flex-shrink:0}
.grp .gp.a{color:var(--ok)}.grp .gp.m{color:var(--alerta)}.grp .gp.b{color:var(--mal)}
.grp .gbar{height:6px;background:#EBE5DA;border-radius:100px;overflow:hidden;margin-left:4px}
.grp .gbar i{display:block;height:100%;border-radius:100px;background:var(--col);transition:width .4s}
.grp .gpend{font-size:11.5px;color:var(--gris);margin-top:8px;margin-left:4px;line-height:1.4}

/* RESEÑAS */
.plat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:12px}
.pcard{background:var(--papel);border:1.5px solid var(--borde);border-radius:13px;padding:13px 10px;text-align:center;box-shadow:var(--s);position:relative;overflow:hidden}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--col)}
.pcard .pn{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gris2);margin-bottom:7px}
.pcard .pv{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:24px;line-height:1;margin-bottom:4px}
.pcard .pd{font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:3px}
.pcard .pd.up{color:var(--ok)}.pcard .pd.dn{color:var(--mal)}.pcard .pd.eq{color:var(--gris2)}

.lrow{background:var(--papel);border:1.5px solid var(--borde);border-radius:13px;padding:14px;margin-bottom:9px;box-shadow:var(--s);position:relative;overflow:hidden}
.lrow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--col)}
.lrow .lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;margin-left:4px}
.lrow .lh strong{font-family:'Archivo';font-variation-settings:'wdth' 105,'wght' 700;font-size:15.5px}
.lrow .lh small{font-size:11.5px;color:var(--gris2)}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-left:4px}
.met{text-align:center;padding:9px 4px;background:var(--hueso);border-radius:9px}
.met b{display:block;font-family:'Archivo';font-variation-settings:'wght' 800;font-size:15px;line-height:1.1;margin-bottom:2px}
.met small{font-size:9.5px;color:var(--gris2);line-height:1.15;display:block}
.met .dl{font-size:9.5px;font-weight:700;margin-top:3px}
.met .dl.up{color:var(--ok)}.met .dl.dn{color:var(--mal)}.met .dl.eq{color:var(--gris2)}
.met.bad b{color:var(--mal)}.met.good b{color:var(--ok)}

.hist-r{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--borde);align-items:center}
.hist-r:last-child{border-bottom:none}
.hist-r .hf{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:11px;color:var(--gris2);width:60px;flex-shrink:0;letter-spacing:.04em}
.hist-r .hv{flex:1;display:flex;gap:12px;font-size:12.5px;flex-wrap:wrap}
.hist-r .hv span{color:var(--gris)}
.hist-r .hv b{color:var(--tinta);font-weight:600}
.hbox{background:var(--papel);border:1.5px solid var(--borde);border-radius:13px;padding:4px 14px;box-shadow:var(--s)}

.mej{background:var(--papel);border:1.5px solid var(--borde);border-left:5px solid var(--alerta);border-radius:12px;padding:13px 14px;margin-bottom:8px;box-shadow:var(--s)}
.mej.cerr{border-left-color:var(--ok);opacity:.62}
.mej .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:9px;margin-bottom:4px}
.mej strong{font-size:14px;font-weight:600;line-height:1.3}
.mej p{font-size:12.5px;color:var(--gris);line-height:1.5}
.mej .mf{font-size:11px;color:var(--gris2);margin-top:6px;display:flex;gap:10px;align-items:center}
.mej .mf button{font-size:11px;font-weight:700;color:var(--ok)}
.mej.cerr .mf button{color:var(--gris2)}

.quin{background:var(--tinta);border-radius:16px;padding:18px;color:var(--hueso);margin-bottom:11px;position:relative;overflow:hidden}
.quin.urg{background:linear-gradient(135deg,#8C1F24,#C1272D)}
.quin.hecha{background:linear-gradient(135deg,#2F5E20,#4A7C2F)}
.quin .qk{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.quin .qd{background:rgba(255,255,255,.16);padding:3px 9px;border-radius:100px;font-size:10.5px;letter-spacing:.04em}
.quin h2{font-family:'Archivo';font-variation-settings:'wdth' 108,'wght' 800;font-size:23px;line-height:1.12;margin-bottom:12px}
.quin .qrow{display:flex;align-items:center;gap:14px}
.ring{width:62px;height:62px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-variation-settings:'wght' 800;font-size:15px}
.quin .qi{flex:1;min-width:0}
.quin .qi strong{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
.quin .qi span{font-size:12.5px;opacity:.75;line-height:1.4;display:block}

/* MINI STATS */
.mini3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:11px}
.m3{background:var(--papel);border:1.5px solid var(--borde);border-radius:12px;padding:12px 9px;text-align:center;box-shadow:var(--s)}
.m3 b{display:block;font-family:'Archivo';font-variation-settings:'wght' 800;font-size:20px;line-height:1;margin-bottom:3px}
.m3 small{font-size:10px;color:var(--gris2);font-weight:500;line-height:1.25;display:block}
.m3.ok b{color:var(--ok)}.m3.mal b{color:var(--mal)}.m3.am b{color:var(--alerta)}

/* PUNTO DÉBIL */
.debil{background:var(--papel);border:1.5px solid var(--borde);border-left:5px solid var(--mal);border-radius:12px;padding:14px 15px;margin-bottom:9px;box-shadow:var(--s)}
.debil .dk{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mal);margin-bottom:6px}
.debil strong{display:block;font-size:14.5px;font-weight:600;margin-bottom:4px;line-height:1.3}
.debil p{font-size:12.5px;color:var(--gris);line-height:1.5}

/* EQUIPO ENCARGADO */
.eq-r{background:var(--papel);border:1.5px solid var(--borde);border-radius:12px;padding:12px 14px;margin-bottom:7px;display:flex;gap:11px;align-items:center;box-shadow:var(--s)}
.eq-r .i{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-variation-settings:'wght' 800;font-size:12px;flex-shrink:0;color:#fff}
.eq-r .i.ok{background:var(--ok)}.eq-r .i.no{background:var(--mal)}.eq-r .i.med{background:var(--alerta)}
.eq-r .b{flex:1;min-width:0}
.eq-r .b strong{display:block;font-size:14px;font-weight:600}
.eq-r .b small{font-size:11.5px;color:var(--gris2)}
.eq-r .st{font-size:11.5px;font-weight:700;flex-shrink:0}
.eq-r .st.ok{color:var(--ok)}.eq-r .st.no{color:var(--mal)}.eq-r .st.med{color:var(--alerta)}

.selm{background:var(--papel);border:1.5px solid var(--borde);border-radius:11px;padding:12px 13px;margin-bottom:7px;display:flex;gap:11px;align-items:center;width:100%}
.selm[aria-pressed="true"]{border-color:var(--tinta);border-width:2px;background:#FFFBF5}
.selm .cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--borde2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.selm[aria-pressed="true"] .cb{background:var(--tinta);border-color:var(--tinta)}
.selm .cb svg{opacity:0;width:12px;height:12px;stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.selm[aria-pressed="true"] .cb svg{opacity:1}
.selm .b{flex:1;min-width:0}
.selm .b strong{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.selm .b small{font-size:11.5px;color:var(--gris2)}

.prog-c{background:var(--papel);border:1.5px solid var(--borde);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--s)}
.prog-c .r{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.prog-c strong{font-family:'Archivo';font-variation-settings:'wdth' 105,'wght' 700;font-size:16px}
.prog-c .pc{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:22px;color:var(--verde)}
.bar{height:8px;background:#EBE5DA;border-radius:100px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--verde);border-radius:100px;transition:width .5s}
.prog-c .sub{font-size:12.5px;color:var(--gris);margin-top:9px;line-height:1.45}

.mod{background:var(--papel);border:1.5px solid var(--borde);border-radius:13px;padding:14px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start;width:100%;box-shadow:var(--s);position:relative;overflow:hidden}
.mod::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--col)}
.mod .ic{width:36px;height:36px;border-radius:10px;background:var(--col);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-left:4px}
.mod .ic svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.mod-b{flex:1;min-width:0}
.mod-b strong{display:block;font-size:14.5px;font-weight:600;line-height:1.3;margin-bottom:3px}
.mod-b .mt{font-size:12px;color:var(--gris2);display:flex;gap:9px;flex-wrap:wrap}
.mod.hecho{background:#F5F9F2;border-color:#CFE2C4}
.mod.hecho strong{color:var(--gris)}
.mod .res{font-size:11.5px;font-weight:600;margin-top:4px}
.mod .res.ok{color:var(--ok)}.mod .res.mal{color:var(--mal)}
.tg{display:inline-block;padding:2px 7px;border-radius:5px;font-size:9.5px;font-weight:700;text-transform:uppercase;vertical-align:middle;margin-left:4px}
.tg-n{background:#EEF4FA;color:var(--azul)}
.tg-r{background:#FDECEC;color:var(--mal)}
.tg-c{background:#FDECEC;color:var(--mal)}

.aviso-l{background:var(--papel);border:1.5px solid var(--borde);border-left:5px solid var(--amarillo);border-radius:12px;padding:14px 15px;margin-bottom:9px;box-shadow:var(--s)}
.aviso-l strong{display:block;font-size:14px;margin-bottom:4px}
.aviso-l p{font-size:12.5px;color:var(--gris);line-height:1.5}
.aviso-l .de{font-size:11.5px;color:var(--gris2);margin-top:6px}

.play{position:fixed;inset:0;background:var(--tinta);z-index:220;display:none;flex-direction:column}
.play.on{display:flex}
.p-top{padding:14px 16px 0;flex-shrink:0}
.p-bar{display:flex;gap:3px;margin-bottom:12px}
.p-seg{flex:1;height:4px;border-radius:100px;background:rgba(255,255,255,.16)}
.p-seg.on{background:var(--amarillo)}
.p-seg.ok{background:var(--verde)}.p-seg.mal{background:var(--roja)}
.p-head{display:flex;align-items:center;justify-content:space-between}
.p-x{color:rgba(245,242,236,.55);font-size:13px;font-weight:600;padding:6px 0}
.p-n{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:12px;color:rgba(245,242,236,.45);letter-spacing:.08em}
.p-body{flex:1;overflow-y:auto;padding:8px 18px 18px}
.p-foot{padding:14px 16px 16px;flex-shrink:0}

.slide-k{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amarillo);margin-bottom:9px}
.slide-t{font-family:'Archivo';font-variation-settings:'wdth' 105,'wght' 700;font-size:26px;line-height:1.18;color:var(--hueso);margin-bottom:14px}
.slide-p{font-size:16px;line-height:1.6;color:rgba(245,242,236,.78);margin-bottom:13px}
.slide-p b{color:var(--amarillo)}
.slide-d{background:rgba(255,255,255,.07);border-radius:13px;padding:16px;margin-bottom:13px}
.slide-d .big{font-family:'Archivo';font-variation-settings:'wght' 900;font-size:36px;color:var(--amarillo);line-height:1;margin-bottom:6px}
.slide-d .sm{font-size:13.5px;color:rgba(245,242,236,.7);line-height:1.45}
.pasos-l{background:rgba(255,255,255,.06);border-radius:13px;padding:6px 16px;margin-bottom:13px}
.pasos-l .pl{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.08);align-items:flex-start}
.pasos-l .pl:last-child{border-bottom:none}

let marcados={pablo:[{mod:'n1',quien:'Jesús',nota:'Ayer se pasaron las porciones de guacamole en varios pedidos. Repásalo antes del viernes.'}],andy:[{area:'producto',quien:'Nando',nota:'Los dos productos nuevos hay que tenerlos claros antes del finde. Dale un repaso al área entera.'}]};

/* Días de plazo según frecuencia */
const FREQ_D={'Cada 3 semanas':21,'Mensual':30,'Una vez':0};

/* Devuelve {orden, dias, txt, cls} para un módulo y el usuario actual */
function plazo(m,e){
 e=e||user;
 const h=(hechos[e.id]||{})[m.id];
 const mk=(marcados[e.id]||[]).find(x=>x.mod===m.id);
 if(mk)return {orden:1,txt:'Marcado',cls:'pl-marc'};
 if(h!==undefined&&h<60)return {orden:2,txt:'A repetir',cls:'pl-urg'};
 if(QUIN.mods.includes(m.id)&&QUIN.roles.includes(e.rol)&&(h===undefined||h<60)){
  const d=diasRest();
  if(d<0)return {orden:0,dias:d,txt:'Vencido',cls:'pl-venc'};
  if(d===0)return {orden:3,dias:0,txt:'Hoy',cls:'pl-urg'};
  if(d<=2)return {orden:3,dias:d,txt:`${d} día${d>1?'s':''}`,cls:'pl-urg'};
  if(d<=7)return {orden:4,dias:d,txt:`${d} días`,cls:'pl-med'};
  return {orden:5,dias:d,txt:`${d} días`,cls:'pl-ok'};
 }
 if(h!==undefined)return {orden:9,txt:h>=80?'Al día':'Repasa',cls:h>=80?'pl-hecho':'pl-med'};
 if(m.crit)return {orden:6,txt:'Crítico',cls:'pl-med'};
 const d=FREQ_D[m.fr]||30;
 return {orden:7,txt:d?m.fr:'Sin plazo',cls:'pl-neu'};
}
function ordenar(ms,e){return ms.slice().sort((a,b)=>plazo(a,e).orden-plazo(b,e).orden)}

 document.querySelectorAll('.chips .chip[data-a]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.a===marcArea))}
function togMarc(id){const i=marcSel.indexOf(id);
 if(i>=0)marcSel.splice(i,1);else marcSel.push(id);

function reenviar(id){if(!marcSel.length&&!marcArea)return toast('Selecciona módulos o un área');
 const e=EMP.find(x=>x.id===id);
 let lista=marcSel.slice();
 if(marcArea)lista=lista.concat(MOD.filter(m=>m.pub&&m.cat===marcArea&&m.roles.includes(e.rol)).map(m=>m.id));
 lista=[...new Set(lista)];
 if(!asign[id])asign[id]=[];
 lista.forEach(m=>{if(!asign[id].includes(m))asign[id].push(m);if(hechos[id])delete hechos[id][m]});
 cerrarSheet();toast(`${lista.length} módulo${lista.length>1?'s':''} reenviado${lista.length>1?'s':''} a ${e.n}`);setTimeout(pintar,300)}
function guardarMarca(){if(!marcSel.length&&!marcArea)return toast('Selecciona módulos o un área');
 const nota=document.getElementById('mk-n').value.trim();
 if(!nota)return toast('Escribe por qué se lo marcas. Sin motivo no sirve de nada');
 if(!marcados[marcQuien])marcados[marcQuien]=[];
 if(marcArea){const ex=marcados[marcQuien].findIndex(x=>x.area===marcArea);
  const nuevo={area:marcArea,quien:user.n,nota};
  if(ex>=0)marcados[marcQuien][ex]=nuevo;else marcados[marcQuien].push(nuevo)}
 marcSel.forEach(m=>{const ex=marcados[marcQuien].findIndex(x=>x.mod===m);
  const nuevo={mod:m,quien:user.n,nota};
  if(ex>=0)marcados[marcQuien][ex]=nuevo;else marcados[marcQuien].push(nuevo)});
 const e=EMP.find(x=>x.id===marcQuien),n=marcSel.length+(marcArea?1:0);
 saveConfig('marcados',marcados);
 cerrarSheet();toast(`Marcado a ${e.n}`);setTimeout(pintar,300)}

function sigSlide(){if(P.i<P.m.slides.length-1){P.i++}else{P.fase='t';P.q=0;P.res=null;P.ord=[]}pPlay()}
function corrOrden(){const t=P.m.test[P.q],ok=P.ord.every((x,i)=>x===t.items[i]);
 P.res={ok};P.marks[P.q]=ok?'ok':'mal';if(ok)P.ac++;else P.fallos.push(t.q);pPlay()}
function corrColor(c){const t=P.m.test[P.q],ok=c===t.r;
 P.res={ok,dado:c};P.marks[P.q]=ok?'ok':'mal';if(ok)P.ac++;else P.fallos.push('Color del ticket');pPlay()}
function corrCant(o){const t=P.m.test[P.q],ok=o===t.r;
 P.res={ok,dado:o};P.marks[P.q]=ok?'ok':'mal';if(ok)P.ac++;else P.fallos.push(`${t.p} · ${t.i}`);pPlay()}
function corrOpt(i){const t=P.m.test[P.q],ok=!!t.op[i][1];
 P.res={ok,dado:i};P.marks[P.q]=ok?'ok':'mal';if(ok)P.ac++;else P.fallos.push(t.q);pPlay()}
function sigTest(){if(P.q<P.m.test.length-1){P.q++;P.res=null;P.ord=[]}else P.fase='f';pPlay()}

 const t=P.m.t,tot=P.m.test.length,ac=P.ac,fallos=P.fallos;

  <button onclick="cerrarMej('${m.t.replace(/'/g,"")}')">Marcar resuelta</button></div></div>`).join('')}
 ${MEJ.filter(m=>!m.ab).length?`<p class="eye">Resueltas</p>
  ${MEJ.filter(m=>!m.ab).map(m=>`<div class="mej cerr"><div class="mh"><strong>${m.t}</strong>
  <span class="pl pl-hecho">Resuelta</span></div><p>${m.d}</p><div class="mf"><span>${m.f}</span></div></div>`).join('')}`:''}

 <p class="eye">Añadir punto a mejorar</p>
 <div class="f-c"><label>Local</label><select id="mj-l"><option>General</option>${LOCALES.map(l=>`<option>${l}</option>`).join('')}</select></div>
 <div class="f-c"><label>Qué</label><input id="mj-t" placeholder="Ej: quejas de temperatura al alza"></div>
 <div class="f-c"><label>Detalle y qué hacer</label><textarea id="mj-d" placeholder="Con el dato que lo justifica"></textarea></div>
 <button class="ed-add" onclick="addMej()">Guardar</button>

 <p class="eye">Recomendación visible para el equipo</p>
 <div class="pie" style="margin-top:0;margin-bottom:12px">Esto sí lo ve el equipo en su pantalla de inicio. Lo de arriba es solo para vosotros.</div>
 ${RECO.map(r=>`<div class="aviso-l"><strong>${r.loc} · ${r.t}</strong><p>${r.d}</p><div class="de">${r.de}</div></div>`).join('')}
 <div class="f-c"><label>Local</label><select id="r-l">${LOCALES.map(l=>`<option>${l}</option>`).join('')}</select></div>
 <div class="f-c"><label>Titular</label><input id="r-t" placeholder="Ej: Prioridad: verificación de pedidos"></div>
 <div class="f-c"><label>Qué mejorar y por qué</label><textarea id="r-d" placeholder="Con el dato que lo justifica"></textarea></div>
 <button class="ed-add" onclick="pubReco()">Publicar al local</button>
 <div class="pie"><strong>Actualizad esto cada mes en la reunión.</strong> El valor no está en el número de un mes, está en ver la variación: si la satisfacción de artículos sube dos puntos tras publicar una quincena de formación, eso es la prueba de que funciona.</div>`}

function addRese(){const f=document.getElementById('rs-f').value.trim(),l=document.getElementById('rs-l').value;
 const u=parseFloat(document.getElementById('rs-u').value),s=parseInt(document.getElementById('rs-s').value),
  g=parseInt(document.getElementById('rs-g').value),o=parseFloat(document.getElementById('rs-o').value);
 if(!f||!/^\d{4}-\d{2}$/.test(f))return toast('Formato de mes: 2026-09');
 if(isNaN(u)||isNaN(s))return toast('Uber y satisfacción son obligatorios');
 const i=RESE.findIndex(r=>r.f===f&&r.l===l);
 const nuevo={f,l,uber:u,sat:s,glovo:isNaN(g)?98:g,google:isNaN(o)?4.4:o};
 if(i>=0)RESE[i]=nuevo;else RESE.push(nuevo);
 saveConfig('resenas',RESE);
 toast(`${l} · ${mesTxt(f)} guardado`);setTimeout(pintar,300)}
function addMej(){const l=document.getElementById('mj-l').value,t=document.getElementById('mj-t').value.trim(),
 d=document.getElementById('mj-d').value.trim();
 if(!t||!d)return toast('Rellena el qué y el detalle');
 MEJ.unshift({l,t,d,f:new Date().toLocaleDateString('es-ES',{month:'short',year:'numeric'}),ab:1});
 saveConfig('mejoras',MEJ);
 toast('Punto añadido');setTimeout(pintar,300)}
function cerrarMej(t){const m=MEJ.find(x=>x.t.replace(/'/g,"")===t);
 if(m){m.ab=0;saveConfig('mejoras',MEJ);toast('Marcada como resuelta');setTimeout(pintar,300)}}
function pubReco(){const l=document.getElementById('r-l').value,
 t=document.getElementById('r-t').value.trim(),d=document.getElementById('r-d').value.trim();
 if(!t||!d)return toast('Rellena titular y texto');
 const i=RECO.findIndex(r=>r.loc===l);
 const nueva={loc:l,t,d,de:'Dirección · '+new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long'})};
 if(i>=0)RECO[i]=nueva;else RECO.push(nueva);
 saveConfig('recomendaciones',RECO);
 toast(`Publicada para ${l}`);setTimeout(pintar,300)}

function cerrarSheet(){document.getElementById('sheet').classList.remove('on')}
function abrirSheet(h,c){const s=document.getElementById('sheet');s.style.setProperty('--col',`var(${c})`);s.innerHTML=h;s.classList.add('on')}
function toast(m){const t=document.getElementById('toast');
 t.innerHTML=`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:#7DD37D;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg><span>${m}</span>`;
 t.classList.add('on');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('on'),2600)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){cerrarPlay();cerrarSheet()}});

async function init(){
 try{
  const [empRes,cfgRes,resRes]=await Promise.all([
   db.from('escuela_empleados').select('*').eq('activo',true),
   db.from('escuela_config').select('*'),
   db.from('escuela_resultados').select('*')
  ]);
  if(empRes.error)throw empRes.error;
  if(cfgRes.error)throw cfgRes.error;
  if(resRes.error)throw resRes.error;

  EMP=empRes.data.map(e=>({id:e.id,n:e.nombre,rol:e.rol,pin:e.pin,loc:e.local}));

  resRes.data.slice().sort((a,b)=>new Date(a.creado_en)-new Date(b.creado_en)).forEach(r=>{
   if(!hechos[r.empleado_id])hechos[r.empleado_id]={};
   hechos[r.empleado_id][r.modulo_id]=r.porcentaje});

  const cfg={};(cfgRes.data||[]).forEach(c=>cfg[c.clave]=c.valor);
  const faltantes=[];

  if(cfg.quincena){QUIN={...cfg.quincena,fin:new Date(cfg.quincena.fin)}}
  else faltantes.push(saveConfig('quincena',{...QUIN,fin:QUIN.fin.toISOString()}));

  if(cfg.publicados){const pubs=cfg.publicados;MOD.forEach(m=>m.pub=pubs.includes(m.id)?1:0)}
  else faltantes.push(saveConfig('publicados',MOD.filter(m=>m.pub).map(m=>m.id)));

  if(cfg.marcados)marcados=cfg.marcados;
  else faltantes.push(saveConfig('marcados',marcados));

  if(cfg.resenas)RESE=cfg.resenas;
  else faltantes.push(saveConfig('resenas',RESE));

  if(cfg.mejoras)MEJ=cfg.mejoras;
  else faltantes.push(saveConfig('mejoras',MEJ));

  if(cfg.recomendaciones)RECO=cfg.recomendaciones;
  else faltantes.push(saveConfig('recomendaciones',RECO));

  await Promise.all(faltantes);

  document.getElementById('loading').style.display='none';
  document.getElementById('login').style.display='block';
  pLogin();
 }catch(err){
  console.error(err);
  document.getElementById('loadMsg').style.display='none';
  document.querySelector('#loading .spin').style.display='none';
  document.getElementById('loadErr').style.display='block';
 }
}
init();
</script>
