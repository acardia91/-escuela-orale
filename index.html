<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Equipo Órale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Paleta tomada de la web de marca (web-orale-padre/styles.css), no aproximada:
   crema, tinta, burdeos, oro, nopal, chile y azul son los valores exactos. */
:root{--tinta:#241A1C;--hueso:#F5EEE6;--papel:#FBF7F2;--borde:#DDD0C2;--borde2:#C9B7A6;
--gris:#6E5C60;--gris2:#9A8A8C;--vino:#7C2430;--roja:#8E2F26;--naranja:#8A5A2B;--verde:#4A5F3C;
--azul:#3B5260;--amarillo:#7E6526;--marron:#6B4A33;--morado:#55406B;--teal:#365A54;
--display:'Anton','Arial Narrow',Impact,sans-serif;
--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
--negro:#0E0A0B;--negro-2:#171113;
--ok:#4A6340;--alerta:#8A6A2E;--mal:#7C2430;
/* Sistema: tinta sobre papel. Radios cortos, sin sombras flotantes,
   el color es un canto macizo y no un lavado pálido de fondo. */
--r:8px;--r2:4px;--s:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--hueso);color:var(--tinta);line-height:1.5;overscroll-behavior:none;-webkit-text-size-adjust:100%}
/* con una capa abierta (visor, panel) el fondo no debe desplazarse detras */
body.bloqueado{overflow:hidden;position:fixed;width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:left}
input,textarea,select{font-family:inherit}

/* ACCESO: mismo lenguaje que oralepadre.com — papel crema, tinta,
   burdeos, y el filete sobre y bajo el titulo, que es su sello. */
#login{position:fixed;inset:0;background:var(--hueso);z-index:300;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(26px,calc(env(safe-area-inset-top) + 16px)) max(18px,env(safe-area-inset-left)) max(30px,calc(env(safe-area-inset-bottom) + 16px)) max(18px,env(safe-area-inset-right))}
#login>*{position:relative;z-index:1}
.lc{max-width:460px;margin:0 auto 24px;text-align:center}
.lc .logo{display:block;width:86px;height:auto;margin:0 auto 16px}
.lc::before{content:'PLATAFORMA DE EQUIPO · CUATRO LOCALES';display:block;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.26em;color:var(--gris);margin-bottom:12px}
/* Filete arriba y abajo del titulo: el recurso de la web de marca */
.lc .m{font-family:var(--display);font-size:clamp(38px,11.5vw,50px);line-height:.92;color:var(--tinta);text-transform:uppercase;letter-spacing:.005em;border-top:2px solid var(--tinta);border-bottom:2px solid var(--tinta);padding:9px 0 11px}
.lc .m span{color:var(--vino)}
.lc p{color:var(--gris);font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.04em;margin-top:13px}
/* Control segmentado: pista oscura, pastilla sólida al seleccionar.
   Rejilla y no fila porque con cuatro locales no caben en el movil. */
.locs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;max-width:460px;margin:0 auto 14px;padding:4px;background:var(--papel);border:1px solid var(--borde);border-radius:12px}
.locb{padding:11px 8px;font-size:11.5px;font-weight:600;letter-spacing:.03em;background:none;color:var(--gris);text-align:center;border-radius:8px;transition:background .18s,color .18s}
.locb[aria-pressed="true"]{background:var(--vino);color:#fff;font-weight:700}
@media(min-width:430px){.locs{grid-template-columns:repeat(4,1fr)}}

/* Lista agrupada: una sola superficie, filas altas y filetes de 1px */
.emps{max-width:460px;margin:0 auto;background:var(--papel);border:1px solid var(--borde);border-radius:14px;overflow:hidden;box-shadow:0 14px 30px -24px rgba(36,26,28,.5)}
/* Entrada escalonada: la pantalla se monta en vez de aparecer de golpe */
@keyframes sube{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.lc,.locs,.emps,.dir,.pinw{animation:sube .42s cubic-bezier(.2,.8,.2,1) backwards}
.locs{animation-delay:.05s}.emps{animation-delay:.1s}.dir{animation-delay:.16s}
.emp{animation:sube .4s cubic-bezier(.2,.8,.2,1) backwards}
.quieto .locs,.quieto .emps,.quieto .dir,.quieto .pinw,.quieto .emp{animation:none}
.emp:nth-child(1){animation-delay:.12s}.emp:nth-child(2){animation-delay:.16s}
.emp:nth-child(3){animation-delay:.2s}.emp:nth-child(4){animation-delay:.24s}
.emp:nth-child(5){animation-delay:.28s}.emp:nth-child(6){animation-delay:.32s}
.emp:nth-child(n+7){animation-delay:.36s}
.lpie{max-width:460px;margin:22px auto 0;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris2)}
.emp{display:flex;align-items:center;gap:13px;width:100%;min-height:62px;padding:11px 14px;background:none;border:none;position:relative;transition:background .16s}
.emp+.emp::before{content:'';position:absolute;left:67px;right:0;top:0;height:1px;background:var(--borde)}
.emp:active{background:var(--hueso)}
.emp .i{width:40px;height:40px;border-radius:12px;background:linear-gradient(155deg,color-mix(in srgb,var(--col) 86%,#fff),var(--col) 46%,color-mix(in srgb,var(--col) 62%,#000));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:16px;letter-spacing:.03em;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(0,0,0,.22),0 3px 10px -3px color-mix(in srgb,var(--col) 60%,transparent)}
.emp .eb{flex:1;min-width:0}
.emp strong{display:block;font-size:16.5px;font-weight:600;color:var(--tinta);line-height:1.2;letter-spacing:-.01em}
.emp small{display:block;color:var(--gris2);font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;margin-top:2px;text-transform:lowercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp .pend{flex-shrink:0;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--amarillo);letter-spacing:.02em;white-space:nowrap}
.emp .pend b{font-family:var(--mono);font-weight:600;font-size:14px}
.emp .pend::after{content:'';width:7px;height:7px;border-right:1.6px solid var(--borde2);border-bottom:1.6px solid var(--borde2);transform:rotate(-45deg);flex-shrink:0}
.emp .pend.cero{color:var(--gris2)}
.dir{margin:12px auto 0;max-width:460px;background:var(--papel);border:1px solid var(--borde);border-radius:14px;padding:16px;text-align:center;color:var(--gris);font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;display:block;width:100%;transition:background .16s}
.dir:active{background:var(--hueso)}
.pinw{max-width:300px;margin:0 auto;text-align:center}
.pinw h2{font-family:var(--display);font-size:30px;letter-spacing:.01em;text-transform:uppercase;color:var(--tinta);margin-bottom:7px}
.pinw .s{color:var(--gris);font-family:var(--mono);font-size:11px;letter-spacing:.04em;margin-bottom:30px}
.dots{display:flex;gap:14px;justify-content:center;margin-bottom:34px}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--borde2);transition:transform .18s,background .18s,border-color .18s}
.dot.on{background:var(--vino);border-color:var(--vino);transform:scale(1.18);box-shadow:0 0 12px rgba(124,36,48,.3)}
.dot.err{background:var(--mal);border-color:var(--mal)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.pad button{aspect-ratio:1.45;background:var(--papel);border:1px solid var(--borde);box-shadow:0 1px 0 var(--borde);border-radius:14px;color:var(--tinta);font-family:var(--mono);font-weight:500;font-size:23px;text-align:center;display:flex;align-items:center;justify-content:center;transition:transform .11s cubic-bezier(.2,.8,.2,1),background .11s}
.pad button:active{transform:scale(.93);background:var(--vino);border-color:var(--vino);color:#fff}
.pad .t{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);background:none;border-color:transparent}
.pad .t:active{background:var(--papel);border-color:var(--borde);color:var(--gris)}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:sh .3s}

.top{position:sticky;top:0;z-index:50;background:var(--tinta);padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
.tr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .i{width:32px;height:32px;border-radius:var(--r2);background:var(--amarillo);color:var(--tinta);display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-variation-settings:'wght' 800;font-size:13px;flex-shrink:0}
.who strong{display:block;color:var(--hueso);font-size:14px;line-height:1.2}
.who small{color:rgba(245,242,236,.42);font-size:11.5px}
.salir{background:rgba(255,255,255,.09);color:rgba(245,242,236,.75);padding:7px 12px;border-radius:var(--r2);font-size:12.5px;font-weight:600}
.tabs{display:flex;gap:6px;margin-top:11px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 0;min-width:fit-content;white-space:nowrap;padding:9px 10px;border-radius:var(--r2);font-size:12.5px;font-weight:600;background:rgba(255,255,255,.07);color:rgba(245,242,236,.55);text-align:center}
.tab[aria-pressed="true"]{background:var(--hueso);color:var(--tinta)}

.wrap{--pad:max(16px,env(safe-area-inset-left));padding:16px max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) var(--pad);max-width:1000px;margin:0 auto}
/* Cabecera de seccion con regla discontinua: guiño al ticket de cocina */
/* Cabecera de seccion sobre regla discontinua: guiño al ticket de cocina.
   Como borde inferior, no como elemento en linea, para que aguante titulos largos. */
.eye{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--tinta);margin:26px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:7px;border-bottom:1.5px dashed var(--borde2)}
.eye:first-child{margin-top:0}
.eye b{color:var(--gris2);font-weight:700;letter-spacing:.1em;margin-left:auto}

/* QUINCENA HERO */
/* ETIQUETAS DE PLAZO */
.pl{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--r2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pl-venc{background:#7A1418;color:#fff}
.pl-urg{background:#FDECEC;color:var(--mal)}
.pl-med{background:#FEF4E9;color:var(--alerta)}
.pl-ok{background:#EEF4FA;color:var(--azul)}
.pl-neu{background:#F0EDE7;color:var(--gris2)}
.pl-hecho{background:#EAF3E4;color:var(--ok)}
.pl-marc{background:var(--vino);color:#fff}
.pl svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}

.mod-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.mod-h strong{flex:1;min-width:0}

/* MARCADO POR ENCARGADO */
.marc{background:var(--papel);border:1px solid var(--borde);border-left:4px solid var(--vino);border-radius:var(--r);padding:13px 14px;margin-bottom:9px}
.marc .mk{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--vino);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.marc .mk::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--vino)}
.marc strong{display:block;font-size:14.5px;font-weight:600;margin-bottom:4px;line-height:1.3}
.marc p{font-size:12.5px;color:var(--gris);line-height:1.5;font-style:italic}
.marc .de{font-size:11.5px;color:var(--gris2);margin-top:6px;font-style:normal}

/* GRUPOS CON % */
.grp{background:var(--papel);border:1px solid var(--borde);border-left:4px solid var(--col);border-radius:var(--r);padding:14px;margin-bottom:9px;width:100%;position:relative;overflow:hidden}
.grp .gh{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.grp .ic{width:34px;height:34px;border-radius:var(--r2);background:var(--col);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.grp .ic svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grp .gb{flex:1;min-width:0}
.grp .gb strong{display:block;font-family:'Archivo';font-variation-settings:'wdth' 105,'wght' 700;font-size:14.5px;line-height:1.2}
.grp .gb small{font-size:11.5px;color:var(--gris2)}
.grp .gp{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:19px;flex-shrink:0}
.grp .gp.a{color:var(--ok)}.grp .gp.m{color:var(--alerta)}.grp .gp.b{color:var(--mal)}
.grp .gbar{height:6px;background:#EBE5DA;border-radius:100px;overflow:hidden}
.grp .gbar i{display:block;height:100%;border-radius:100px;background:var(--col);transition:width .4s}
.grp .gpend{font-size:11.5px;color:var(--gris);margin-top:8px;line-height:1.4}

/* RESEÑAS */
.plat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:12px}
.pcard{background:var(--papel);border:1px solid var(--borde);border-top:4px solid var(--col);border-radius:var(--r);padding:13px 10px;text-align:center;position:relative;overflow:hidden}
.pcard .pn{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gris2);margin-bottom:7px}
.pcard .pv{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:24px;line-height:1;margin-bottom:4px}
.pcard .pd{font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:3px}
.pcard .pd.up{color:var(--ok)}.pcard .pd.dn{color:var(--mal)}.pcard .pd.eq{color:var(--gris2)}

.lrow{background:var(--papel);border:1px solid var(--borde);border-left:4px solid var(--col);border-radius:var(--r);padding:14px;margin-bottom:9px;position:relative;overflow:hidden}
.lrow .lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:8px}
.lrow .lh strong{font-family:'Archivo';font-variation-settings:'wdth' 105,'wght' 700;font-size:15.5px;display:flex;align-items:center;gap:8px}
.lrow .lh strong::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--col);flex-shrink:0}
.lrow .lh small{font-size:11.5px;color:var(--gris2)}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.met{text-align:center;padding:9px 4px;background:var(--hueso);border-radius:var(--r2)}
.met b{display:block;font-family:'Archivo';font-variation-settings:'wght' 800;font-size:15px;line-height:1.1;margin-bottom:2px}
.met small{font-size:9.5px;color:var(--gris2);line-height:1.15;display:block}
.met .dl{font-size:9.5px;font-weight:700;margin-top:3px}
.met .dl.up{color:var(--ok)}.met .dl.dn{color:var(--mal)}.met .dl.eq{color:var(--gris2)}
.met.bad b{color:var(--mal)}.met.good b{color:var(--ok)}

.hist-r{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--borde);align-items:center}
.hist-r:last-child{border-bottom:none}
.hist-r .hf{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:11px;color:var(--gris2);width:60px;flex-shrink:0;letter-spacing:.04em}
.hist-r .hv{flex:1;display:flex;gap:12px;font-size:12.5px;flex-wrap:wrap}
.hist-r .hv span{color:var(--gris)}
.hist-r .hv b{color:var(--tinta);font-weight:600}
.hbox{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);padding:4px 14px}

.mej{background:var(--papel);border:1px solid var(--borde);border-left:4px solid var(--alerta);border-radius:var(--r);padding:13px 14px;margin-bottom:8px}
.mej.cerr{border-left-color:var(--ok);opacity:.55}
.mej .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:9px;margin-bottom:4px}
.mej strong{font-size:14px;font-weight:600;line-height:1.3}
.mej p{font-size:12.5px;color:var(--gris);line-height:1.5}
.mej .mf{font-size:11px;color:var(--gris2);margin-top:6px;display:flex;gap:10px;align-items:center}
.mej .mf button{font-size:11px;font-weight:700;color:var(--ok)}
.mej.cerr .mf button{color:var(--gris2)}

/* HOY: fila de historias con lo que toca ver, anillo si esta pendiente */
.hoy-w{margin:0 0 22px}
.hoy-t{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.hoy-t strong{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.01em}
.hoy-t span{font-family:var(--mono);font-size:10.5px;color:var(--gris2)}
.hoy{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain;padding:2px 0 4px;margin-inline:calc(-1*var(--pad,16px));padding-inline:var(--pad,16px)}
.hoy::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;width:80px;background:none;border:none;padding:0;text-align:center;position:relative;scroll-snap-align:start}
.st .ring{display:block;width:76px;height:76px;border-radius:50%;padding:3px;box-sizing:border-box;background:linear-gradient(145deg,var(--amarillo),var(--vino) 62%,var(--roja));transition:transform .14s cubic-bezier(.2,.8,.2,1)}
.st.ok .ring{background:var(--borde)}
/* display:block obligatorio: es un span y en linea ignora el tamaño,
   se estiraba a 107px de alto y asomaba como una franja clara */
.st .in{display:block;width:100%;height:100%;border-radius:50%;background:var(--hueso);padding:2.5px;box-sizing:border-box}
.st .av{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--col);display:flex;align-items:center;justify-content:center}
.st .av img{width:100%;height:100%;object-fit:cover;display:block}
.st .av svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.st.ok .av{filter:grayscale(.85);opacity:.5}
/* Etiqueta: dos lineas como mucho, cortada por palabra y legible de verdad */
/* Dos lineas reservadas siempre: con una u otra, la fila queda a escuadra */
.st small{display:-webkit-box;margin-top:9px;min-height:28px;font-size:11.5px;font-weight:600;color:var(--tinta);line-height:1.22;letter-spacing:-.01em;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:break-word}
.st.ok small{color:var(--gris2);font-weight:500}
.st:active .ring{transform:scale(.92)}
.st .bd{position:absolute;top:-1px;right:2px;background:var(--roja);color:#fff;font-family:var(--mono);font-size:8.5px;font-weight:600;line-height:1;letter-spacing:.04em;padding:3px 5px;border-radius:100px;border:2px solid var(--hueso)}
/* Superado: sello de visto, mas claro que un simple gris */
.st .tick{position:absolute;top:40px;right:2px;width:22px;height:22px;border-radius:50%;background:var(--ok);border:2.5px solid var(--hueso);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.st .tick svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}

.quin{background:var(--tinta);border-radius:var(--r);padding:18px;color:var(--hueso);margin-bottom:11px;position:relative;overflow:hidden}
.quin.urg{background:linear-gradient(135deg,#8C1F24,#C1272D)}
.quin.hecha{background:linear-gradient(135deg,#2F5E20,#4A7C2F)}
.quin .qk{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.quin .qd{background:rgba(255,255,255,.16);padding:3px 9px;border-radius:100px;font-size:10.5px;letter-spacing:.04em}
.quin h2{font-family:var(--display);font-size:27px;line-height:1.02;letter-spacing:.01em;text-transform:uppercase;margin-bottom:12px}
.quin .qrow{display:flex;align-items:center;gap:14px}
.ring{width:62px;height:62px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-variation-settings:'wght' 800;font-size:15px}
.quin .qi{flex:1;min-width:0}
.quin .qi strong{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
.quin .qi span{font-size:12.5px;opacity:.75;line-height:1.4;display:block}

/* MINI STATS */
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}
/* los locales son cuatro: 2x2 en movil, en fila cuando hay sitio */
.minil{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:11px}
@media(min-width:460px){.minil{grid-template-columns:repeat(4,1fr)}}
.m3{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);padding:12px 9px;text-align:center}
.m3 b{display:block;font-family:'Archivo';font-variation-settings:'wght' 800;font-size:20px;line-height:1;margin-bottom:3px}
.m3 small{font-size:10px;color:var(--gris2);font-weight:500;line-height:1.25;display:block}
.m3.ok b{color:var(--ok)}.m3.mal b{color:var(--mal)}.m3.am b{color:var(--alerta)}

/* PUNTO DÉBIL */
.debil{background:var(--papel);border:1px solid var(--borde);border-left:4px solid var(--mal);border-radius:var(--r);padding:14px 15px;margin-bottom:9px}
.debil .dk{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mal);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.debil .dk::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--mal)}
.debil strong{display:block;font-size:14.5px;font-weight:600;margin-bottom:4px;line-height:1.3}
.debil p{font-size:12.5px;color:var(--gris);line-height:1.5}

/* EQUIPO ENCARGADO */
.eq-r{background:var(--papel);border:1.5px solid var(--borde);border-radius:var(--r);padding:12px 14px;margin-bottom:7px;display:flex;gap:11px;align-items:center;box-shadow:var(--s)}
.eq-r .i{width:32px;height:32px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-variation-settings:'wght' 800;font-size:12px;flex-shrink:0;color:#fff}
.eq-r .i.ok{background:var(--ok)}.eq-r .i.no{background:var(--mal)}.eq-r .i.med{background:var(--alerta)}
.eq-r .b{flex:1;min-width:0}
.eq-r .b strong{display:block;font-size:14px;font-weight:600}
.eq-r .b small{font-size:11.5px;color:var(--gris2)}
.eq-r .st{font-size:11.5px;font-weight:700;flex-shrink:0}
.eq-r .st.ok{color:var(--ok)}.eq-r .st.no{color:var(--mal)}.eq-r .st.med{color:var(--alerta)}

.selm{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);padding:12px 13px;margin-bottom:7px;display:flex;gap:11px;align-items:center;width:100%}
.selm[aria-pressed="true"]{border-color:var(--tinta);border-width:2px;background:#FFFBF5}
.selm .cb{width:22px;height:22px;border-radius:var(--r2);border:2px solid var(--borde2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.selm[aria-pressed="true"] .cb{background:var(--tinta);border-color:var(--tinta)}
.selm .cb svg{opacity:0;width:12px;height:12px;stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.selm[aria-pressed="true"] .cb svg{opacity:1}
.selm .b{flex:1;min-width:0}
.selm .b strong{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.selm .b small{font-size:11.5px;color:var(--gris2)}

.prog-c{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);padding:16px;margin-bottom:12px}
.prog-c .r{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.prog-c strong{font-family:'Archivo';font-variation-settings:'wdth' 105,'wght' 700;font-size:16px}
.prog-c .pc{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:22px;color:var(--verde)}
.bar{height:8px;background:#EBE5DA;border-radius:100px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--verde);border-radius:100px;transition:width .5s}
.prog-c .sub{font-size:12.5px;color:var(--gris);margin-top:9px;line-height:1.45}

.mod{background:var(--papel);border:1px solid var(--borde);border-left:4px solid var(--col);border-radius:var(--r);padding:14px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start;width:100%;position:relative;overflow:hidden}
.mod .ic{width:38px;height:38px;border-radius:var(--r2);background:var(--col);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.mod .ic svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mod-b{flex:1;min-width:0}
.mod-b strong{display:block;font-size:14.5px;font-weight:600;line-height:1.3;margin-bottom:3px}
.mod-b .mt{font-size:12px;color:var(--gris2);display:flex;gap:9px;flex-wrap:wrap}
.mod.hecho{background:#F5F9F2;border-color:#CFE2C4}
.mod.hecho strong{color:var(--gris)}
.mod .res{font-size:11.5px;font-weight:600;margin-top:4px}
.mod .res.ok{color:var(--ok)}.mod .res.mal{color:var(--mal)}
.tg{display:inline-block;padding:2px 7px;border-radius:var(--r2);font-size:9.5px;font-weight:700;text-transform:uppercase;vertical-align:middle;margin-left:4px}
.tg-n{background:#EEF4FA;color:var(--azul)}
.tg-r{background:#FDECEC;color:var(--mal)}
.tg-c{background:#FDECEC;color:var(--mal)}

.aviso-l{background:var(--papel);border:1px solid var(--borde);border-left:4px solid var(--amarillo);border-radius:var(--r);padding:14px 15px;margin-bottom:9px}
.aviso-l strong{display:block;font-size:14px;margin-bottom:4px}
.aviso-l p{font-size:12.5px;color:var(--gris);line-height:1.5}
.aviso-l .de{font-size:11.5px;color:var(--gris2);margin-top:6px}

/* ESTADÍSTICAS DEL PANEL DE DIRECCIÓN */
.est{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);padding:15px;margin-bottom:10px}
.est-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px;gap:10px}
.est-h strong{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.01em}
.est-h span{font-family:var(--mono);font-size:10.5px;color:var(--gris2);text-align:right}
.bar-l{margin-bottom:12px}
.bar-l:last-child{margin-bottom:0}
.bar-l .bt{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px;gap:8px}
.bar-l .bt b{font-weight:600}
.bar-l .bt span{font-family:var(--mono);font-size:11px;color:var(--gris2);flex-shrink:0}
.bar-l .tr{height:9px;background:#EBE5DA;border-radius:100px;overflow:hidden;display:flex}
.bar-l .tr i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar-l .tr i.ok{background:var(--ok)}
.bar-l .tr i.med{background:var(--alerta)}
.bar-l .tr i.mal{background:var(--mal)}
.spark{display:flex;align-items:flex-end;gap:5px;height:56px}
.spark div{flex:1;background:var(--borde);border-radius:3px 3px 0 0;min-height:3px;transition:height .5s}
.spark div.hay{background:var(--vino)}
.spark-x{display:flex;gap:5px;margin-top:6px}
.spark-x span{flex:1;text-align:center;font-family:var(--mono);font-size:9px;color:var(--gris2);text-transform:uppercase}
.rep{display:flex;height:34px;border-radius:var(--r2);overflow:hidden;margin-bottom:9px}
.rep i{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;color:#fff;min-width:0;overflow:hidden}
.rep i.a{background:var(--ok)}.rep i.m{background:var(--alerta)}.rep i.b{background:var(--mal)}.rep i.s{background:var(--borde2);color:var(--gris)}
.rep-l{display:flex;flex-wrap:wrap;gap:11px;font-size:11.5px;color:var(--gris)}
.rep-l span{display:flex;align-items:center;gap:5px}
.rep-l em{width:9px;height:9px;border-radius:2px;display:block;font-style:normal}

/* BLOQUES A MEJORAR */
.bl-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bl-o{display:flex;align-items:center;gap:9px;padding:13px 12px;border-radius:var(--r);font-size:13px;font-weight:600;background:var(--papel);border:1.5px solid var(--borde);color:var(--gris);text-align:left;line-height:1.2}
.bl-o .bl-p{width:11px;height:11px;border-radius:50%;background:var(--borde2);flex-shrink:0}
.bl-o[aria-pressed="true"]{background:var(--papel);border-color:var(--col);color:var(--tinta)}
.bl-o[aria-pressed="true"] .bl-p{background:var(--col)}
/* Lo que ve el empleado */
.bl-c{background:var(--papel);border:1px solid var(--borde);border-left:4px solid var(--col);border-radius:var(--r);padding:13px 14px;margin-bottom:8px}
.bl-c .bh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.bl-c .bh i{width:9px;height:9px;border-radius:50%;background:var(--col);flex-shrink:0}
.bl-c .bh strong{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--col)}
.bl-c p{font-size:13px;color:var(--gris);line-height:1.5}

/* EVALUACIÓN DE DESEMPEÑO */
.ev-c{border-bottom:1.5px dashed var(--borde);padding:12px 0}
.ev-c:last-of-type{border-bottom:none}
.ev-h strong{display:block;font-size:14px;font-weight:600;line-height:1.25}
.ev-h small{display:block;font-size:11.5px;color:var(--gris2);margin-top:2px}
.ev-b{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.ev-o{padding:10px 6px;border-radius:var(--r2);font-size:12.5px;font-weight:600;text-align:center;background:var(--hueso);border:1.5px solid var(--borde);color:var(--gris)}
.ev-o[aria-pressed="true"].v3{background:var(--ok);border-color:var(--ok);color:#fff}
.ev-o[aria-pressed="true"].v2{background:var(--alerta);border-color:var(--alerta);color:#fff}
.ev-o[aria-pressed="true"].v1{background:var(--mal);border-color:var(--mal);color:#fff}
/* Lo que ve el empleado */
.evl{background:var(--papel);border:1px solid var(--borde);border-left:4px solid var(--azul);border-radius:var(--r);padding:14px 15px;margin-bottom:9px}
.evl .eh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
.evl .eh strong{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.01em}
.evl .eh span{font-family:var(--mono);font-size:11px;color:var(--gris2)}
.evl .el{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--borde)}
.evl .el:last-of-type{border-bottom:none}
.evl .el b{font-weight:600;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.evl .el b.v3{color:var(--ok)}.evl .el b.v2{color:var(--alerta)}.evl .el b.v1{color:var(--mal)}
.evl p{font-size:12.5px;color:var(--gris);line-height:1.5;margin-top:10px;font-style:italic}
.evl .de{font-size:11.5px;color:var(--gris2);margin-top:7px}

/* PROTOCOLO PRODUCTO NUEVO */
.proto{background:var(--papel);border:1px solid var(--borde);border-left:4px solid var(--col);border-radius:var(--r);margin-bottom:12px;overflow:hidden;width:100%;text-align:left;display:block}
.proto .pimg{width:100%;aspect-ratio:16/9;background:var(--hueso);border-bottom:1.5px dashed var(--borde2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.proto .pimg img{width:100%;height:100%;object-fit:cover;display:block}
.proto .pimg svg{width:26px;height:26px;stroke:var(--col);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
/* sin foto no se reserva el hueco entero: quedaba un vacio enorme */
.proto .pimg.sinfoto{aspect-ratio:auto;height:56px}
.proto .pimg.sinfoto .pmin{display:none}
.proto .pimg .ptag{position:absolute;top:0;left:0;background:var(--col);color:#fff;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:6px 11px;border-radius:0 0 var(--r2) 0}
.proto .pimg .pmin{position:absolute;bottom:0;right:0;background:var(--tinta);color:var(--hueso);font-size:11px;font-weight:600;padding:5px 10px;border-radius:var(--r2) 0 0 0}
.proto .pb{padding:13px 14px 14px}
.proto .pk{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--col);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.proto .pk::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--col)}
.proto strong.pt{display:block;font-family:'Archivo';font-variation-settings:'wdth' 105,'wght' 700;font-size:17px;line-height:1.2;margin-bottom:8px}
.proto .pll{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.proto .pll span{font-size:12px;font-weight:600;padding:5px 9px;border-radius:var(--r2);background:var(--hueso);border:1px solid var(--borde);color:var(--tinta)}
.proto .pal{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--mal);font-weight:600;line-height:1.4;margin-bottom:9px}
.proto .pal svg{width:15px;height:15px;flex-shrink:0;stroke:var(--mal);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.proto .pcl{font-size:12.5px;color:var(--gris);line-height:1.5;margin-bottom:12px}
.proto .pcl b{color:var(--tinta)}
.proto .pcta{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tinta);color:var(--hueso);border-radius:var(--r2);padding:13px 14px;font-family:'Archivo';font-variation-settings:'wght' 700;font-size:14px;transition:opacity .12s}
.proto .pcta small{font-family:'Inter';font-weight:500;font-size:12px;opacity:.85}
.proto .pcta svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;flex-shrink:0}
.proto:active .pcta{opacity:.82}
.proto.leido{opacity:.72}
.proto.leido .pcta{background:var(--hueso);color:var(--ok);border:1px solid var(--borde)}
.mod .ic.th{background:none;overflow:hidden}
.mod .ic.th img{width:100%;height:100%;object-fit:cover;display:block}

/* visor: protocolo */
.hero-img{width:100%;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;margin-bottom:14px;background:rgba(255,255,255,.06)}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.ficha{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:14px 16px;margin-bottom:13px}
.ficha .fh{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,242,236,.5);margin-bottom:8px}
.ficha .fl2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ficha .fl2 span{font-size:13.5px;font-weight:600;color:var(--hueso);background:rgba(255,255,255,.09);padding:6px 10px;border-radius:var(--r2)}
.ficha .fa{display:flex;gap:8px;align-items:flex-start;color:#FF9A9A;font-size:14px;font-weight:600;line-height:1.4}
.ficha .fa svg{width:16px;height:16px;flex-shrink:0;stroke:#FF9A9A;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.ficha .fc{margin-top:10px;font-size:14px;color:rgba(245,242,236,.78);line-height:1.5}
.ficha .fc b{color:var(--amarillo)}
.p-n.proto-n{color:var(--naranja)}

/* dirección: fotos y marcado de producto nuevo */
.foto-r{background:var(--papel);border:1px solid var(--borde);border-left:4px solid var(--naranja);border-radius:var(--r);padding:12px;margin-bottom:9px;display:flex;gap:12px;align-items:center}
.foto-r .ft{width:72px;height:54px;border-radius:var(--r2);background:var(--hueso);border:1px dashed var(--borde2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.foto-r .ft img{width:100%;height:100%;object-fit:cover;display:block}
.foto-r .ft svg{width:22px;height:22px;stroke:var(--naranja);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.foto-r .fb2{flex:1;min-width:0}
.foto-r .fb2 strong{display:block;font-size:13.5px;font-weight:600;line-height:1.3;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foto-r .fb2 small{font-size:11.5px;color:var(--gris2);display:block;margin-bottom:7px}
.foto-r .fbt{display:flex;gap:6px;flex-wrap:wrap}
.foto-r .fbt label,.foto-r .fbt button{padding:7px 11px;border-radius:var(--r2);font-size:12px;font-weight:600;background:var(--tinta);color:var(--hueso);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.foto-r .fbt button.q{background:var(--hueso);color:var(--gris);border:1.5px solid var(--borde2)}
.foto-r .fbt button.n{background:var(--hueso);color:var(--naranja);border:1px solid var(--borde2)}
.foto-r .fbt input{display:none}
.foto-r .fbt svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.foto-r.subiendo{opacity:.55;pointer-events:none}

/* svh y no dvh: dvh se recalcula mientras la barra del navegador se
   esconde o aparece, y la capa entera se reajusta al desplazarse. */
.play{position:fixed;inset:0;height:100svh;background:var(--tinta);z-index:220;display:none;flex-direction:column}
.play.on{display:flex}
.p-top{padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));flex-shrink:0}
.p-bar{display:flex;gap:3px;margin-bottom:12px}
.p-seg{flex:1;height:4px;border-radius:100px;background:rgba(255,255,255,.16);transition:background .3s}
.p-seg.on{background:var(--amarillo)}
.p-seg.ok{background:var(--verde)}.p-seg.mal{background:var(--roja)}
.p-head{display:flex;align-items:center;justify-content:space-between}
.p-x{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;
 border:1.5px solid rgba(245,242,236,.38);border-radius:100px;background:rgba(245,242,236,.08);
 font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
 color:var(--hueso);transition:background .15s,border-color .15s}
.p-x:active{background:var(--hueso);color:var(--tinta);border-color:var(--hueso)}
.p-x:focus-visible{outline:2px solid var(--hueso);outline-offset:2px}
.p-n{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:12px;color:rgba(245,242,236,.45);letter-spacing:.08em}
.p-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px max(18px,env(safe-area-inset-right)) 18px max(18px,env(safe-area-inset-left))}
.p-foot{padding:14px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));flex-shrink:0}

.slide-k{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amarillo);margin-bottom:9px}
.slide-t{font-family:'Archivo';font-variation-settings:'wdth' 105,'wght' 700;font-size:26px;line-height:1.18;color:var(--hueso);margin-bottom:14px}
.slide-p{font-size:16px;line-height:1.6;color:rgba(245,242,236,.78);margin-bottom:13px}
.slide-p b{color:var(--amarillo)}
.slide-d{background:rgba(255,255,255,.07);border-radius:var(--r);padding:16px;margin-bottom:13px}
.slide-d .big{font-family:'Archivo';font-variation-settings:'wght' 900;font-size:36px;color:var(--amarillo);line-height:1;margin-bottom:6px}
.slide-d .sm{font-size:13.5px;color:rgba(245,242,236,.7);line-height:1.45}
.pasos-l{background:rgba(255,255,255,.06);border-radius:var(--r);padding:6px 16px;margin-bottom:13px}
.pasos-l .pl{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.08);align-items:flex-start}
.pasos-l .pl:last-child{border-bottom:none}
.pasos-l .pn{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:13px;color:var(--amarillo);flex-shrink:0;width:22px}
.pasos-l .pt{font-size:15px;color:var(--hueso);line-height:1.4}
.pasos-l .pt em{font-style:normal;color:var(--amarillo);font-weight:700}
.frase{border-left:3px solid var(--amarillo);padding:4px 0 4px 14px;margin-bottom:13px}

.pbtn{width:100%;background:var(--amarillo);color:var(--tinta);padding:18px;border-radius:var(--r);font-family:'Archivo';font-variation-settings:'wdth' 105,'wght' 800;font-size:17px;text-align:center;box-shadow:0 3px 0 color-mix(in srgb,var(--amarillo) 65%,#000),0 8px 20px -6px rgba(216,155,28,.45);transition:transform .12s,box-shadow .12s}

.pbtn.v{background:var(--verde);box-shadow:0 3px 0 color-mix(in srgb,var(--verde) 65%,#000),0 8px 20px -6px rgba(74,124,47,.4);color:#fff}
.pbtn.v:active{box-shadow:0 1px 0 color-mix(in srgb,var(--verde) 65%,#000),0 4px 10px -6px rgba(74,124,47,.35)}
.pbtn:disabled{opacity:.3;box-shadow:none}
.pback{width:100%;text-align:center;color:rgba(245,242,236,.4);font-size:13px;font-weight:600;padding:11px 0 0}

.q-t{font-family:'Archivo';font-variation-settings:'wdth' 105,'wght' 700;font-size:21px;line-height:1.25;color:var(--hueso);margin-bottom:16px}
.q-h{font-size:13.5px;color:rgba(245,242,236,.5);margin-bottom:14px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:var(--r);padding:16px;color:var(--hueso);font-size:15.5px;font-weight:500;line-height:1.35;transition:transform .12s cubic-bezier(.2,.8,.2,1),background .12s}
.opt:active{transform:scale(.985);background:rgba(255,255,255,.14)}
/* Acertar da un golpe de confirmacion; fallar, una negacion. Se nota y se recuerda. */
.opt.bien{background:var(--verde);border-color:var(--verde);font-weight:600;animation:golpe .42s cubic-bezier(.2,.9,.3,1.3)}
.opt.mal{background:var(--roja);border-color:var(--roja);animation:niega .36s}
@keyframes golpe{0%{transform:scale(1)}35%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes niega{0%,100%{transform:translateX(0)}22%{transform:translateX(-7px)}62%{transform:translateX(6px)}}
.opt.gris{opacity:.4}

.ord-zona{background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.18);border-radius:var(--r);padding:12px;margin-bottom:14px;min-height:80px}
.ord-zona.lleno{border-style:solid}
.ord-i{background:var(--amarillo);color:var(--tinta);border-radius:var(--r2);padding:11px 13px;margin-bottom:6px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px}
.ord-i:last-child{margin-bottom:0}
.ord-i .n{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:12px;opacity:.6}
.ord-i .x{margin-left:auto;opacity:.5;font-size:18px}
.ord-i.bien{background:var(--verde);color:#fff}
.ord-i.mal{background:var(--roja);color:#fff}
.ord-vacio{text-align:center;color:rgba(245,242,236,.35);font-size:13.5px;padding:18px 10px}
.ord-pool{display:flex;flex-wrap:wrap;gap:8px}
.ord-p{background:rgba(255,255,255,.1);color:var(--hueso);border-radius:var(--r2);padding:11px 13px;font-size:14px;font-weight:600}
.ord-p.usado{opacity:.22}

.cant-p{background:rgba(255,255,255,.07);border-radius:var(--r);padding:16px;margin-bottom:14px;text-align:center}
.cant-p .pr{font-family:'Archivo';font-variation-settings:'wght' 700;font-size:19px;color:var(--hueso);margin-bottom:3px}
.cant-p .ing{font-size:14.5px;color:rgba(245,242,236,.6)}
.cant-g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.cant-b{background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:var(--r);padding:20px 8px;text-align:center;color:var(--hueso);font-family:'Archivo';font-variation-settings:'wght' 800;font-size:18px}
.cant-b.bien{background:var(--verde);border-color:var(--verde)}
.cant-b.mal{background:var(--roja);border-color:var(--roja)}

.tick{background:var(--hueso);border-radius:var(--r);padding:15px;margin-bottom:14px;color:var(--tinta)}
.tick .th{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris2);margin-bottom:9px;padding-bottom:8px;border-bottom:1.5px dashed var(--borde2)}
.tick .li{padding:5px 0;font-size:14.5px;font-weight:500}
.tick .nt{margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--borde2);font-size:14px;color:var(--vino);font-weight:600;font-style:italic}
.col-g{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.col-b{border-radius:var(--r);padding:16px 12px;color:#fff;text-align:center;border:2px solid transparent}
.col-b b{display:block;font-family:'Archivo';font-variation-settings:'wght' 800;font-size:15px;margin-bottom:2px}
.col-b span{font-size:12px;opacity:.9}
.col-b.bien{outline:3px solid #8FD37A;outline-offset:2px}
.col-b.mal{outline:3px solid #FF9A9A;outline-offset:2px}
.col-b.gris{opacity:.35}

.fb{background:rgba(255,255,255,.07);border-radius:var(--r);padding:16px;margin-top:14px;border-left:4px solid rgba(255,255,255,.2);animation:entra .34s cubic-bezier(.2,.8,.2,1)}
.fb.si{border-left-color:#8FD37A}.fb.no{border-left-color:#FF9A9A}
@keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fb .ft{font-family:var(--display);font-size:20px;letter-spacing:.01em;text-transform:uppercase;margin-bottom:6px}
.fb.si .ft{color:#8FD37A}.fb.no .ft{color:#FF9A9A}
.fb p{font-size:14.5px;color:rgba(245,242,236,.72);line-height:1.5}

.fin{text-align:center;padding:26px 16px}
.fin .big{font-family:var(--display);font-size:74px;line-height:.9;margin-bottom:8px}
.fin .big.ok{color:#8FD37A}.fin .big.med{color:var(--amarillo)}.fin .big.no{color:#FF9A9A}
.fin h3{font-family:'Archivo';font-variation-settings:'wght' 700;font-size:21px;color:var(--hueso);margin-bottom:10px}
.fin p{font-size:14.5px;color:rgba(245,242,236,.6);line-height:1.55;max-width:340px;margin:0 auto 16px}
.fallos-l{background:rgba(255,255,255,.06);border-radius:var(--r);padding:14px 16px;text-align:left;max-width:400px;margin:0 auto}
.fallos-l .fl{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#FF9A9A;margin-bottom:9px}
.fallos-l li{font-size:14px;color:rgba(245,242,236,.75);margin-bottom:7px;list-style:none;padding-left:16px;position:relative;line-height:1.4}
.fallos-l li::before{content:'·';position:absolute;left:4px;color:#FF9A9A;font-weight:700}

.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.kpi{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-family:'Archivo';font-variation-settings:'wght' 800;font-size:22px;line-height:1;margin-bottom:3px}
.kpi small{font-size:10.5px;color:var(--gris2);font-weight:500;line-height:1.2;display:block}
.kpi.ok b{color:var(--ok)}.kpi.mal b{color:var(--mal)}
.per{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;width:100%}
.per .pos{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--gris2);width:16px;flex-shrink:0;text-align:center}
.per .i{width:34px;height:34px;border-radius:var(--r2);background:var(--hueso);display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-variation-settings:'wght' 800;font-size:13px;flex-shrink:0}
.per-b{flex:1;min-width:0}
.per-b strong{display:block;font-size:14.5px;font-weight:600}
.per-b small{font-size:12px;color:var(--gris2)}
.per .pc{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:19px;flex-shrink:0}
/* Barra de avance: el porcentaje solo no dice cuánto lleva hecho */
.per-bar{height:4px;background:#EBE5DA;border-radius:100px;overflow:hidden;margin-top:7px}
.per-bar i{display:block;height:100%;border-radius:100px;background:var(--ok);transition:width .5s}
.per-bar i.m{background:var(--alerta)}.per-bar i.b{background:var(--mal)}
.per .pc.a{color:var(--ok)}.per .pc.m{color:var(--alerta)}.per .pc.b{color:var(--mal)}
.det{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);padding:12px 14px;margin-bottom:7px}
.det .dr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.det strong{font-size:13.5px;font-weight:600}
.det .p{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:15px}
.det .p.a{color:var(--ok)}.det .p.m{color:var(--alerta)}.det .p.b{color:var(--mal)}
.det small{font-size:11.5px;color:var(--gris2);display:block;margin-top:3px}
.kpi-t{background:var(--papel);border:1px solid var(--borde);border-radius:var(--r);padding:13px 14px;margin-bottom:7px}
.kpi-t .r{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.kpi-t strong{font-size:13.5px;font-weight:600}
.kpi-t .v{font-family:'Archivo';font-variation-settings:'wght' 800;font-size:15px;color:var(--mal)}
.kpi-t small{font-size:11.5px;color:var(--gris2)}

/* sin padding-bottom: un sticky se pega al borde del area de relleno,
   y esos 80px dejaban el boton de accion flotando a media pantalla */
/* Caja flexible: con 'margin-top:auto' en la barra de accion, queda
   abajo cuando el contenido es corto y fluye cuando es largo. Antes,
   con relleno inferior y solo sticky, flotaba a media pantalla. */
.sheet{position:fixed;inset:0;height:100svh;background:var(--hueso);z-index:180;transform:translateY(100%);transition:transform .27s cubic-bezier(.4,0,.2,1);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sh-top{position:sticky;top:0;z-index:5;background:var(--col);color:#fff;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 17px max(16px,env(safe-area-inset-left))}
/* Cerrar: un boton que se ve, no un texto tenue. 44px de alto para el pulgar. */
.sh-x{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px 0 10px;
 border:1.5px solid rgba(255,255,255,.45);border-radius:100px;background:rgba(255,255,255,.1);
 font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
 color:#fff;margin-bottom:13px;transition:background .15s,border-color .15s}
.sh-x:active{background:#fff;color:var(--tinta);border-color:#fff}
.sh-x:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sh-top h2{font-family:var(--display);font-size:27px;letter-spacing:.01em;text-transform:uppercase;margin-bottom:4px;line-height:1.02}
.sh-top p{font-size:13px;opacity:.88}
.f-c{margin-bottom:14px}
.f-c label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gris2);margin-bottom:7px}
/* 16px minimo: por debajo, iOS hace zoom al enfocar y descuadra la pantalla */
.f-c input,.f-c textarea,.f-c select{width:100%;padding:12px 13px;border:1.5px solid var(--borde2);border-radius:var(--r2);font-size:16px;background:var(--papel);outline:none;-webkit-appearance:none;appearance:none}
.f-c input:focus,.f-c textarea:focus,.f-c select:focus{border-color:var(--tinta)}
.f-c textarea{min-height:70px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:100px;font-size:13px;font-weight:600;background:var(--hueso);border:1.5px solid var(--borde2);color:var(--gris)}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--hueso)}
.ed-add{width:100%;background:var(--tinta);color:var(--hueso);padding:14px;border-radius:var(--r);font-family:'Archivo';font-variation-settings:'wght' 700;font-size:14px;text-align:center;margin-top:4px}
.pub{position:sticky;bottom:0;background:var(--hueso);padding:14px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));border-top:1.5px solid var(--borde);margin-top:auto;flex-shrink:0}
.pub-b{width:100%;background:var(--verde);color:#fff;padding:16px;border-radius:var(--r);font-family:'Archivo';font-variation-settings:'wght' 700;font-size:15px;text-align:center}
.pub small{display:block;text-align:center;font-size:11.5px;color:var(--gris2);margin-top:8px}
.pie{margin-top:22px;padding:14px;background:rgba(123,29,58,.045);border-radius:var(--r2);font-size:12.5px;color:var(--gris);line-height:1.55}
.pie strong{color:var(--vino)}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));z-index:400;background:var(--tinta);color:var(--hueso);padding:14px 16px;border-radius:var(--r);font-size:14px;font-weight:500;transform:translateY(150%);transition:transform .3s;display:flex;align-items:center;gap:10px;max-width:500px;margin:0 auto}
.toast.on{transform:translateY(0)}
#loading{position:fixed;inset:0;background:var(--tinta);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#loading .m{font-family:var(--display);font-size:30px;letter-spacing:.01em;color:var(--hueso);text-transform:uppercase}
#loading .m span{color:var(--amarillo)}
#loadMsg{color:rgba(245,242,236,.55);font-size:13.5px}
.spin{width:32px;height:32px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--amarillo);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadErr{display:none;max-width:340px}
#loadErr p{color:#FF9A9A;font-size:13.5px;line-height:1.55;margin-bottom:16px}
#loadErr button{background:var(--amarillo);color:var(--tinta);padding:12px 22px;border-radius:var(--r2);font-weight:700;font-size:14px}
/* MOVILES ESTRECHOS: rejillas de 3 y 4 columnas se quedan sin aire */
@media(max-width:380px){
 .mets{grid-template-columns:1fr 1fr}
 .met small{font-size:10px}
 .plat,.kpis{gap:6px}
 .pcard{padding:11px 7px}
 .pcard .pv,.kpi b{font-size:19px}
 .kpi{padding:10px}
 .kpi small,.pcard .pn{font-size:9.5px}
 .m3 b{font-size:19px}
 .wrap{--pad:max(12px,env(safe-area-inset-left));padding-left:var(--pad);padding-right:max(12px,env(safe-area-inset-right))}
 .proto .pb,.mod,.grp,.lrow{padding-left:12px;padding-right:12px}
 .tab{flex:0 0 auto}
 .fin .big{font-size:52px}
 .slide-t{font-size:23px}
}
/* texto largo sin cortar palabras a lo ancho */
.mod-b strong,.proto strong.pt,.grp .gb strong,.per-b strong,.det strong,.foto-r .fb2 strong{overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2.5px solid var(--amarillo);outline-offset:2px}

/* ===== Como funciona esto: desplegable de bienvenida ===== */
.guia{border:1px solid var(--borde);border-radius:var(--r);background:var(--papel);margin:0 0 20px;overflow:hidden}
.guia{list-style:none}.guia summary::-webkit-details-marker{display:none}
.guia-h{display:flex;align-items:center;gap:11px;width:100%;padding:13px 14px;background:none}
.guia-h .gi{width:30px;height:30px;border-radius:50%;background:var(--tinta);color:var(--hueso);
 display:grid;place-items:center;flex-shrink:0;font-family:var(--display);font-size:15px;padding-top:1px}
.guia-h .gt{flex:1;min-width:0}
.guia-h .gt strong{display:block;font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.01em;line-height:1.1}
.guia-h .gt small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris2);margin-top:3px}
.guia-h .gx{flex-shrink:0;color:var(--gris);transition:transform .22s ease}
.guia[open] .guia-h .gx{transform:rotate(180deg)}
.guia-b{padding:0 14px 14px;display:none}
.guia[open] .guia-b{display:block}
.gp{border-top:1px dashed var(--borde);padding:11px 0 0;margin-top:2px}
.gp:first-child{border-top:0;padding-top:0}
.gpr{display:flex;align-items:flex-start;gap:10px;width:100%;background:none;padding:8px 0;text-align:left}
.gpr .n{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--tinta);flex-shrink:0;
 display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:600;margin-top:1px}
.gpr.on .n{background:var(--tinta);color:var(--hueso)}
.gpr b{display:block;font-size:14px;font-variation-settings:'wght' 650;line-height:1.3}
.gpr .d{display:none;font-size:13px;color:var(--gris);line-height:1.5;margin-top:5px}
.gpr.on .d{display:block}
.gnota{display:flex;gap:7px;margin-top:12px}
.gnota div{flex:1;border-radius:var(--r2);padding:8px 6px;text-align:center;border:1px solid var(--borde)}
.gnota b{display:block;font-family:var(--display);font-size:16px;line-height:1}
.gnota small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris2);margin-top:3px}
.gnota .g-a{border-color:var(--ok)}.gnota .g-a b{color:var(--ok)}
.gnota .g-m{border-color:var(--alerta)}.gnota .g-m b{color:var(--alerta)}
.gnota .g-b{border-color:var(--mal)}.gnota .g-b b{color:var(--mal)}

/* ===== Progreso de la plantilla y uso de la plataforma ===== */
.pg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}
.pg3 div{border:1px solid var(--borde);border-radius:var(--r);background:var(--papel);padding:11px 8px;text-align:center}
.pg3 b{display:block;font-family:var(--display);font-size:22px;line-height:1}
.pg3 i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ok)}
.pg3 small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gris2);margin-top:4px;line-height:1.3}
.sem{display:flex;align-items:flex-end;gap:6px;height:74px;margin:4px 0 6px}
.sem div{flex:1;background:var(--borde);border-radius:2px 2px 0 0;position:relative;min-height:3px}
.sem div.ult{background:var(--tinta)}
.sem span{position:absolute;top:-15px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9px;color:var(--gris)}
.sem-x{display:flex;gap:6px}
.sem-x span{flex:1;text-align:center;font-family:var(--mono);font-size:8.5px;color:var(--gris2);text-transform:uppercase;letter-spacing:.06em}
.usr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--borde)}
.usr:last-child{border-bottom:0}
.usr .ui{width:30px;height:30px;border-radius:50%;background:var(--tinta);color:var(--hueso);display:grid;place-items:center;
 font-family:var(--display);font-size:12px;flex-shrink:0;padding-top:1px}
.usr .ub{flex:1;min-width:0}
.usr .ub strong{display:block;font-size:13.5px;font-variation-settings:'wght' 650}
.usr .ub small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--gris2);margin-top:2px}
.usr .uv{text-align:right;flex-shrink:0}

/* ===== Tiempo de uso =====
   Solo se cuenta mientras la pestana esta visible, para que dejar el movil
   abierto en la mesa no infle el dato. Se vuelca cada minuto y al salir. */
let usoIni=null, usoPend=0, usoTimer=null;
const hoyISO=()=>new Date().toISOString().slice(0,10);

function usoArranca(id){
 if(!id)return;
 usoIni=Date.now(); usoPend=0;
 if(!uso[id])uso[id]={v:0,s:0,u:null,d:{}};
 uso[id].v++; uso[id].u=new Date().toISOString();
 usoVuelca(id,true);
 clearInterval(usoTimer);
 usoTimer=setInterval(()=>usoVuelca(id),60000)}

function usoCorta(){
 if(usoIni===null)return 0;
 const seg=Math.round((Date.now()-usoIni)/1000);
 usoIni=null;
 /* un tramo de mas de 30 min casi seguro es una pestana olvidada */
 return seg>0&&seg<1800?seg:Math.min(seg,1800)}

async function usoVuelca(id,forzar){
 if(!id)return;
 if(usoIni!==null){usoPend+=usoCorta();usoIni=Date.now()}
 if(!usoPend&&!forzar)return;
 const seg=usoPend; usoPend=0;
 /* releemos antes de escribir: el blob es compartido y hay gente a la vez */
 try{
  const {data}=await db.from('escuela_config').select('valor').eq('clave','uso').maybeSingle();
  const srv=(data&&data.valor&&typeof data.valor==='object')?data.valor:{};
  const mio=srv[id]||{v:0,s:0,u:null,d:{}};
  mio.v=Math.max(mio.v||0,(uso[id]||{}).v||0);
  mio.s=(mio.s||0)+seg;
  mio.u=new Date().toISOString();
  mio.d=mio.d||{}; const k=hoyISO(); mio.d[k]=(mio.d[k]||0)+seg;
  srv[id]=mio; uso=srv;
  await saveConfig('uso',srv);
 }catch(err){console.error(err);usoPend+=seg}}

function usoPara(id){clearInterval(usoTimer);usoTimer=null;
 if(usoIni!==null)usoPend+=usoCorta();
 if(usoPend)usoVuelca(id,true)}

document.addEventListener('visibilitychange',()=>{
 const id=user&&user.id; if(!id)return;
 if(document.hidden){if(usoIni!==null)usoPend+=usoCorta();usoVuelca(id,true)}
 else usoIni=Date.now()});
window.addEventListener('pagehide',()=>{const id=user&&user.id;if(id)usoPara(id)});

const fmtDur=sg=>{const m=Math.round((sg||0)/60);
 if(m<1)return 'menos de 1 min';
 if(m<60)return m+' min';
 const h=Math.floor(m/60),r=m%60;return r?`${h} h ${r} min`:`${h} h`};

function saveConfig(clave,valor){
 return db.from('escuela_config').upsert({clave,valor,actualizado_en:new Date().toISOString()}).then(({error})=>{
  if(error){console.error(error);toast('Cambio guardado en el dispositivo, pero no en el servidor')}})}

function plazo(m,e){
 e=e||user;
 const h=(hechos[e.id]||{})[m.id];
 const mk=(marcados[e.id]||[]).find(x=>x.mod===m.id);
 if(mk)return {orden:1,txt:'Marcado',cls:'pl-marc'};
 if(h!==undefined&&h<60)return {orden:2,txt:'A repetir',cls:'pl-urg'};
 if(QUIN.mods.includes(m.id)&&QUIN.roles.includes(e.rol)&&(h===undefined||h<60)){
  const d=diasRest();
  if(d<0)return {orden:0,dias:d,txt:'Vencido',cls:'pl-venc'};
  if(d===0)return {orden:3,dias:0,txt:'Hoy',cls:'pl-urg'};
  if(d<=2)return {orden:3,dias:d,txt:`${d} día${d>1?'s':''}`,cls:'pl-urg'};
  if(d<=7)return {orden:4,dias:d,txt:`${d} días`,cls:'pl-med'};
  return {orden:5,dias:d,txt:`${d} días`,cls:'pl-ok'};
 }
 if(h!==undefined)return {orden:9,txt:h>=80?'Al día':'Repasa',cls:h>=80?'pl-hecho':'pl-med'};
 if(m.crit)return {orden:6,txt:'Crítico',cls:'pl-med'};
 const d=FREQ_D[m.fr]||30;
 return {orden:7,txt:d?m.fr:'Sin plazo',cls:'pl-neu'};
}

/* Fila "Hoy": lo que de verdad toca, en orden de urgencia.
   Primero protocolos nuevos, luego lo marcado por el encargado,
   luego la quincena, luego lo que hay que repetir. Al final, lo hecho. */
function filaHoy(mios,h){
 const pend=m=>h[m.id]===undefined||h[m.id]<60;
 const marc=(marcados[user.id]||[]).filter(x=>x.mod).map(x=>x.mod);
 const grupos=[
  mios.filter(m=>m.nuevo&&pend(m)),
  mios.filter(m=>marc.includes(m.id)&&pend(m)),
  mios.filter(m=>enQuin(m)&&pend(m)),
  mios.filter(m=>h[m.id]!==undefined&&h[m.id]<60)
 ];
 const vistos=new Set(),hoy=[];
 grupos.forEach(g=>g.forEach(m=>{if(!vistos.has(m.id)){vistos.add(m.id);hoy.push(m)}}));
 const hechos2=mios.filter(m=>h[m.id]!==undefined&&h[m.id]>=60&&!vistos.has(m.id)).slice(0,4);
 if(!hoy.length&&!hechos2.length)return '';
 const bola=m=>{const c=CAT[m.cat],ok=h[m.id]!==undefined&&h[m.id]>=60;
  return `<button class="st ${ok?'ok':''}" style="--col:var(${c.c})" onclick="abrirMod('${m.id}')" aria-label="${nombreProd(m)}">
   <span class="ring"><span class="in"><span class="av">${imgs[m.id]?`<img src="${imgs[m.id]}" alt="">`:`<svg viewBox="0 0 24 24">${c.ic}</svg>`}</span></span></span>
   ${m.nuevo&&!ok?'<span class="bd">NUEVO</span>':''}
   ${ok?'<span class="tick"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>':''}
   <small>${etiquetaCorta(m)}</small></button>`};
 return `<div class="hoy-w"><div class="hoy-t"><strong>Hoy</strong>
  <span>${hoy.length?hoy.length+' por ver':'todo al día'}</span></div>
  <div class="hoy">${hoy.map(bola).join('')}${hechos2.map(bola).join('')}</div></div>`}

 {k:'limpieza',n:'Limpieza y orden',c:'--verde',tip:'Deja la zona como te gustaría encontrarla. Producto sin etiqueta es producto de fecha desconocida: no se usa.'},

/* Una persona puede cubrir varios locales. 'local' sigue siendo el suyo

function localesDe(e){const l=locales[e.id];return (l&&l.length)?l:[e.loc]}
function trabajaEn(e,loc){return localesDe(e).indexOf(loc)>=0}
/* Módulos activos por local: cada local arrastra problemas distintos

function modsDe(e){
 /* 'solo' limita un modulo a personas concretas: no lo ve nadie mas */
 const suyo=m=>m.pub&&m.roles.includes(e.rol)&&(!m.solo||m.solo.includes(e.id));
 /* A quien no es encargado se le deja solo lo basico, mas lo que se le
    haya enviado a mano y lo que sea suyo en exclusiva. Asi no se le
    abren veinte protocolos de golpe. */
 const llano=e.rol==='empleado'&&basicos.length;
 const base=m=>!llano||basicos.includes(m.id)||(asign[e.id]||[]).includes(m.id)||(m.solo||[]).includes(e.id);
 const ids=new Set();
 localesDe(e).forEach(l=>(modsPorLocal[l]||[]).forEach(id=>ids.add(id)));
 if(!ids.size)return MOD.filter(m=>suyo(m)&&base(m));
 return MOD.filter(m=>suyo(m)&&base(m)&&
  (ids.has(m.id)||QUIN.mods.includes(m.id)||(asign[e.id]||[]).includes(m.id)||(m.solo||[]).includes(e.id)))}

(function(){

 document.addEventListener('touchstart',e=>{
  const p=document.getElementById('play');
  if(!p||!p.classList.contains('on')||!P||P.fase!=='s'){x0=null;return}
  if(e.target.closest('.p-foot')){x0=null;return}
  const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now()},{passive:true});

  if(x0===null)return;
  const t=e.changedTouches[0],dx=t.clientX-x0,dy=Math.abs(t.clientY-y0),dt=Date.now()-t0;
  x0=null;

})();

/* ===== Dónde flojea cada local =====
   Media por protocolo de la gente que trabaja ahi. Un protocolo que
   todos suspenden no es un problema de personas: esta mal explicado. */
function flojeaLocal(l,limite){
 const es=EMP.filter(e=>trabajaEn(e,l));
 const filas=[];
 MOD.filter(m=>m.pub).forEach(m=>{
  const notas=es.filter(e=>(hechos[e.id]||{})[m.id]!==undefined).map(e=>hechos[e.id][m.id]);
  const sin=es.filter(e=>modsDe(e).some(x=>x.id===m.id)&&(hechos[e.id]||{})[m.id]===undefined).length;
  if(!notas.length&&!sin)return;
  filas.push({m,md:notas.length?Math.round(notas.reduce((a,b)=>a+b,0)/notas.length):null,n:notas.length,sin});
 });
 /* primero lo suspendido, luego lo que nadie ha tocado */
 filas.sort((a,b)=>{
  const va=a.md===null?999:a.md, vb=b.md===null?999:b.md;
  if(va!==vb)return va-vb; return b.sin-a.sin});
 return filas.slice(0,limite||4)}

function panelFlojea(locs){
 return locs.map(l=>{const f=flojeaLocal(l);
  if(!f.length)return `<div class="flo"><div class="fh"><strong>${l}</strong><span>sin datos</span></div>
   <div class="flo-r"><span class="n">Nadie ha hecho todavía ningún protocolo aquí.</span></div></div>`;
  return `<div class="flo"><div class="fh"><strong>${l}</strong><span>lo más flojo primero</span></div>
  ${f.map(x=>`<div class="flo-r">
   <span class="n">${x.m.t}${x.m.crit?' · crítico':''}</span>
   <span class="v ${x.md===null?'b':x.md>=80?'a':x.md>=60?'m':'b'}">${x.md===null?`${x.sin} sin hacer`:x.md+'%'}</span></div>`).join('')}
  </div>`}).join('')}

/* ===== Recomendaciones: a quién le hace falta qué =====
   No es magia: cruza quien tiene el protocolo pendiente o suspendido
   con lo critico que es, y deja el envio a un toque. */
function recomendaciones(gente){
 const recs=[];
 MOD.filter(m=>m.pub).forEach(m=>{
  const suspenden=[],sinHacer=[];let alcance=0;
  gente.forEach(e=>{
   if(!modsDe(e).some(x=>x.id===m.id))return;
   alcance++;
   const v=(hechos[e.id]||{})[m.id];
   if(v===undefined){if(!(asign[e.id]||[]).includes(m.id))sinHacer.push(e)}
   else if(v<60)suspenden.push(e)});
  /* Suspender siempre es señal: alguien lo intentó y no salió. */
  if(suspenden.length)recs.push({m,quien:suspenden,tipo:'repetir',
   peso:(m.crit?100:0)+suspenden.length*10});
  /* "Sin hacer" solo vale como aviso cuando es un rezagado. Si no lo ha
     hecho nadie, o ya es el foco de la quincena, no es un hueco: es que
     acaba de salir, y repetirlo cinco veces tapa lo que sí importa. */
  if(sinHacer.length>=2&&sinHacer.length<alcance&&!QUIN.mods.includes(m.id))
   recs.push({m,quien:sinHacer,tipo:'enviar',peso:(m.crit?60:0)+sinHacer.length});
 });
 recs.sort((a,b)=>b.peso-a.peso);
 return recs.slice(0,5)}

function panelRecos(gente){
 const recs=recomendaciones(gente);
 recosActuales=recs;
 if(!recs.length){
  const hayNotas=gente.some(e=>Object.keys(hechos[e.id]||{}).length);

/* Direccion sube o baja a alguien de encargado. Cambia lo que ve esa
   persona al entrar, asi que se avisa de que tiene que volver a entrar. */
async function togRol(id,b){
 const e=EMP.find(x=>x.id===id); if(!e)return;
 const nuevo=e.rol==='encargado'?'empleado':'encargado';
 b.setAttribute('aria-pressed',nuevo==='encargado');
 const {error}=await db.from('escuela_empleados').update({rol:nuevo}).eq('id',id);
 if(error){console.error(error);b.setAttribute('aria-pressed',e.rol==='encargado');
  return toast('No se ha podido cambiar el rol en el servidor')}
 e.rol=nuevo;
 toast(nuevo==='encargado'?`${e.n} ya es encargado. Lo verá al volver a entrar`
  :`${e.n} vuelve a ser empleado`);
 const sh=document.getElementById('sheet');
 if(sh&&sh.classList.contains('on')){const p=sh.querySelector('.sh-top p');if(p)p.textContent=`${nuevo} · ${localesDe(e).join(' · ')}`}}

 if(!sel.length)return toast('No has seleccionado ninguno');
 if(!asign[id])asign[id]=[];
 sel.forEach(m=>{if(!asign[id].includes(m))asign[id].push(m);if(hechos[id])delete hechos[id][m]});
 saveConfig('asign',asign);
 const e=EMP.find(x=>x.id===id);
 cerrarSheet();toast(`${sel.length} módulo${sel.length>1?'s':''} enviado${sel.length>1?'s':''} a ${e.n}`);setTimeout(pintar,300)}


/* ===== Publicar u ocultar en bloque ===== */
function pubTodos(valor,cat){
 const afecta=MOD.filter(m=>!cat||m.cat===cat);
 const antes=afecta.filter(m=>!!m.pub===!!valor).length;
 if(antes===afecta.length)return toast(valor?'Ya estaban todos visibles':'Ya estaban todos ocultos');
 afecta.forEach(m=>m.pub=valor?1:0);
 /* un modulo oculto no puede seguir siendo el foco de la quincena */
 const fuera=QUIN.mods.filter(id=>!MOD.find(m=>m.id===id&&m.pub));
 if(fuera.length){QUIN.mods=QUIN.mods.filter(id=>!fuera.includes(id));
  saveConfig('quincena',{...QUIN,fin:QUIN.fin.toISOString()})}
 saveConfig('publicados',MOD.filter(m=>m.pub).map(m=>m.id));
 const n=afecta.length-antes;
 toast(`${n} ${n===1?'protocolo':'protocolos'} ${valor?'visibles para el equipo':'ocultos'}${cat?' · '+CAT[cat].n:''}`);
 pintar()}

/* Foto de producto: se reduce en el móvil (máx 900px, JPEG) y se guarda en escuela_config.imgs */
function subirFoto(id,input){const file=input.files&&input.files[0];if(!file)return;

 const done=()=>{if(row)row.classList.remove('subiendo');input.value=''};
 const img=new Image();const url=URL.createObjectURL(file);

/* ===== Progreso de la plantilla =====
   Se calcula sobre RESULTADOS, que son las filas crudas con fecha.
   'hechos' solo guarda la ultima nota, asi que no sirve para ver evolucion. */
function panelProgreso(){
 /* cobertura: pares persona-modulo superados sobre los que le tocan */
 let sup=0,tot=0;
 EMP.forEach(e=>{const h=hechos[e.id]||{};modsDe(e).forEach(m=>{tot++;if(h[m.id]!==undefined&&h[m.id]>=60)sup++})});
 const cob=tot?Math.round(sup/tot*100):0;

 /* primeros intentos: el primer resultado de cada par persona-modulo */
 const porPar={};
 RESULTADOS.slice().sort((a,b)=>new Date(a.creado_en)-new Date(b.creado_en))
  .forEach(r=>{const k=r.empleado_id+'|'+r.modulo_id;(porPar[k]=porPar[k]||[]).push(r)});
 const pares=Object.values(porPar);
 const prim=pares.map(v=>v[0].porcentaje);
 const aPrim=prim.length?Math.round(prim.filter(v=>v>=60).length/prim.length*100):0;

 /* mejora: cuanto sube de media quien repite un protocolo */
 const rep=pares.filter(v=>v.length>1).map(v=>v[v.length-1].porcentaje-v[0].porcentaje);
 const mej=rep.length?Math.round(rep.reduce((a,b)=>a+b,0)/rep.length):null;

 /* cobertura acumulada al cierre de cada una de las ultimas 4 semanas */
 const hoy=new Date();hoy.setHours(23,59,59,999);
 const cortes=[];for(let i=3;i>=0;i--){const d=new Date(hoy);d.setDate(d.getDate()-i*7);cortes.push(d)}
 const serie=cortes.map(d=>{
  const vistos={};
  RESULTADOS.forEach(r=>{if(new Date(r.creado_en)<=d){
   const k=r.empleado_id+'|'+r.modulo_id;
   const t=new Date(r.creado_en);
   if(!vistos[k]||t>vistos[k].t)vistos[k]={t,v:r.porcentaje}}});
  const ok=Object.values(vistos).filter(x=>x.v>=60).length;
  return tot?Math.round(ok/tot*100):0});
 const maxS=Math.max(1,...serie);
 const delta=serie[3]-serie[0];

 return `<p class="eye">Cómo progresa la plantilla ${delta?`<b>${delta>0?'+':''}${delta} ${Math.abs(delta)===1?'punto':'puntos'} en 4 semanas</b>`:'<b>sin cambios este mes</b>'}</p>
 <div class="pg3">
  <div><b>${cob}%</b><small>protocolos superados</small></div>
  <div><b>${aPrim}%</b><small>aprobados a la primera</small></div>
  <div><b>${mej===null?'—':(mej>0?'+':'')+mej}${mej===null?'':'<i> pts</i>'}</b><small>mejora al repetir</small></div>
 </div>
 <div class="est"><div class="est-h"><strong>Avance semana a semana</strong><span>% de protocolos superados</span></div>
  <div class="sem">${serie.map((v,i)=>`<div class="${i===3?'ult':''}" style="height:${Math.max(3,Math.round(v/maxS*100))}%"><span>${v}%</span></div>`).join('')}</div>
  <div class="sem-x"><span>hace 3 sem</span><span>hace 2</span><span>semana pasada</span><span>hoy</span></div></div>`}

  return {e,v:u.v||0,s:u.s||0,dias}}).sort((a,b)=>b.s-a.s);
 const act=filas.filter(f=>f.dias!==null&&f.dias<=7).length;
 const nunca=filas.filter(f=>f.v===0).length;
 const totSeg=filas.reduce((a,f)=>a+f.s,0);
 const cuando=d=>d===null?'nunca ha entrado':d===0?'hoy':d===1?'ayer':d<7?`hace ${d} días`:d<30?`hace ${Math.round(d/7)} sem`:`hace ${Math.round(d/30)} meses`;
 return `<p class="eye">Uso de la plataforma <b>${act} de ${EMP.length} esta semana</b></p>

  <div><b>${fmtDur(totSeg).replace(' min','′').replace(' h','h')}</b><small>tiempo total</small></div>

 <div class="f-c"><label>Titular</label><input id="r-t" placeholder="Ej: Prioridad: verificación de pedidos"></div>
 <div class="f-c"><label>Qué mejorar y por qué</label><textarea id="r-d" placeholder="Con el dato que lo justifica"></textarea></div>
 <button class="ed-add" onclick="pubReco()">Publicar al local</button>
 <div class="pie"><strong>Actualizad esto cada mes en la reunión.</strong> El valor no está en el número de un mes, está en ver la variación: si la satisfacción de artículos sube dos puntos tras publicar una quincena de formación, eso es la prueba de que funciona.</div>`}

function addRese(){const f=document.getElementById('rs-f').value.trim(),l=document.getElementById('rs-l').value;
 const u=parseFloat(document.getElementById('rs-u').value),s=parseInt(document.getElementById('rs-s').value),
  g=parseInt(document.getElementById('rs-g').value),o=parseFloat(document.getElementById('rs-o').value);
 if(!f||!/^\d{4}-\d{2}$/.test(f))return toast('Formato de mes: 2026-09');
 if(isNaN(u)||isNaN(s))return toast('Uber y satisfacción son obligatorios');
 const i=RESE.findIndex(r=>r.f===f&&r.l===l);
 const nuevo={f,l,uber:u,sat:s,glovo:isNaN(g)?98:g,google:isNaN(o)?4.4:o};
 if(i>=0)RESE[i]=nuevo;else RESE.push(nuevo);
 saveConfig('resenas',RESE);
 toast(`${l} · ${mesTxt(f)} guardado`);setTimeout(pintar,300)}
/* VOLCADO MASIVO: pegar el mes entero de todos los locales de una vez,
   en vez de rellenar el formulario local por local. Tolerante con el
   formato: reconoce el local y coge los números que vengan detrás. */
function volcarRese(){
 const txt=(document.getElementById('vc-t').value||'').trim();
 if(!txt)return toast('Pega los datos primero');
 const mes=(document.getElementById('vc-f').value||'').trim();
 if(!/^\d{4}-\d{2}$/.test(mes))return toast('Indica el mes en formato 2026-10');
 const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
 const ok=[],fallo=[];
 txt.split(/\r?\n/).forEach(linea=>{
  if(!linea.trim())return;
  const loc=LOCALES.find(l=>norm(linea).startsWith(norm(l)));
  if(!loc){fallo.push(linea.trim().slice(0,28));return}
  const nums=(linea.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(',','.')));
  if(nums.length<2){fallo.push(linea.trim().slice(0,28));return}
  const [u,s,g,o]=nums;
  const nuevo={f:mes,l:loc,uber:u,sat:Math.round(s),
   glovo:g===undefined?98:Math.round(g),google:o===undefined?4.4:o};
  const i=RESE.findIndex(r=>r.f===mes&&r.l===loc);
  if(i>=0)RESE[i]=nuevo;else RESE.push(nuevo);
  ok.push(loc)});
 if(!ok.length)return toast('No he reconocido ningún local en lo que has pegado');
 saveConfig('resenas',RESE);
 toast(`${ok.length} local${ok.length>1?'es':''} guardado${ok.length>1?'s':''}${fallo.length?` · ${fallo.length} sin reconocer`:''}`);
 setTimeout(pintar,400)}

function addMej(){const l=document.getElementById('mj-l').value,t=document.getElementById('mj-t').value.trim(),
 d=document.getElementById('mj-d').value.trim();
 if(!t||!d)return toast('Rellena el qué y el detalle');
 MEJ.unshift({l,t,d,f:new Date().toLocaleDateString('es-ES',{month:'short',year:'numeric'}),ab:1});
 saveConfig('mejoras',MEJ);
 toast('Punto añadido');setTimeout(pintar,300)}
function cerrarMej(t){const m=MEJ.find(x=>x.t.replace(/'/g,"")===t);
 if(m){m.ab=0;saveConfig('mejoras',MEJ);toast('Marcada como resuelta');setTimeout(pintar,300)}}
function pubReco(){const l=document.getElementById('r-l').value,
 t=document.getElementById('r-t').value.trim(),d=document.getElementById('r-d').value.trim();
 if(!t||!d)return toast('Rellena titular y texto');
 const i=RECO.findIndex(r=>r.loc===l);
 const nueva={loc:l,t,d,de:'Dirección · '+new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long'})};
 if(i>=0)RECO[i]=nueva;else RECO.push(nueva);
 saveConfig('recomendaciones',RECO);
 toast(`Publicada para ${l}`);setTimeout(pintar,300)}

function cerrarSheet(){const s=document.getElementById('sheet');if(!s.classList.contains('on'))return;
 s.classList.remove('on');liberarFondo()}
function abrirSheet(h,c){const s=document.getElementById('sheet');s.style.setProperty('--col',`var(${c})`);s.innerHTML=h;s.scrollTop=0;
 if(!s.classList.contains('on')){s.classList.add('on');bloquearFondo()}}
function toast(m){const t=document.getElementById('toast');
 t.innerHTML=`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:#7DD37D;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg><span>${m}</span>`;
 t.classList.add('on');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('on'),2600)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){cerrarPlay();cerrarSheet()}});

async function init(){
 try{
  const [empRes,cfgRes,resRes]=await Promise.all([
   db.from('escuela_empleados').select('*').eq('activo',true),
   db.from('escuela_config').select('*'),
   db.from('escuela_resultados').select('*')
  ]);
  if(empRes.error)throw empRes.error;
  if(cfgRes.error)throw cfgRes.error;
  if(resRes.error)throw resRes.error;

  EMP=empRes.data.map(e=>({id:e.id,n:e.nombre,rol:e.rol,pin:e.pin,loc:e.local}));

  RESULTADOS=resRes.data||[];
  resRes.data.slice().sort((a,b)=>new Date(a.creado_en)-new Date(b.creado_en)).forEach(r=>{
   if(!hechos[r.empleado_id])hechos[r.empleado_id]={};
   hechos[r.empleado_id][r.modulo_id]=r.porcentaje});

  const cfg={};(cfgRes.data||[]).forEach(c=>cfg[c.clave]=c.valor);
  const faltantes=[];

  if(cfg.quincena){QUIN={...cfg.quincena,fin:new Date(cfg.quincena.fin)}}
  else faltantes.push(saveConfig('quincena',{...QUIN,fin:QUIN.fin.toISOString()}));

  if(cfg.publicados){const pubs=cfg.publicados;MOD.forEach(m=>m.pub=pubs.includes(m.id)?1:0)}
  else faltantes.push(saveConfig('publicados',MOD.filter(m=>m.pub).map(m=>m.id)));

  if(cfg.asign&&typeof cfg.asign==='object')asign=cfg.asign;
  else faltantes.push(saveConfig('asign',{}));

  if(cfg.evaluaciones&&typeof cfg.evaluaciones==='object')evaluaciones=cfg.evaluaciones;
  else faltantes.push(saveConfig('evaluaciones',{}));

  if(cfg.bloques&&typeof cfg.bloques==='object')bloques=cfg.bloques;
  else faltantes.push(saveConfig('bloques',{}));

  if(cfg.locales&&typeof cfg.locales==='object')locales=cfg.locales;
  else faltantes.push(saveConfig('locales',{}));

  if(cfg.porlocal&&typeof cfg.porlocal==='object')modsPorLocal=cfg.porlocal;
  else faltantes.push(saveConfig('porlocal',{}));

  if(Array.isArray(cfg.basicos))basicos=cfg.basicos;
  else faltantes.push(saveConfig('basicos',[]));

  if(cfg.uso&&typeof cfg.uso==='object')uso=cfg.uso;
  else faltantes.push(saveConfig('uso',{}));

  if(cfg.marcados)marcados=cfg.marcados;
  else faltantes.push(saveConfig('marcados',marcados));

  if(cfg.imgs&&typeof cfg.imgs==='object')imgs=cfg.imgs;
  else faltantes.push(saveConfig('imgs',{}));

  if(Array.isArray(cfg.nuevos)){MOD.forEach(m=>m.nuevo=cfg.nuevos.includes(m.id)?1:0)}
  else faltantes.push(saveConfig('nuevos',MOD.filter(m=>m.nuevo).map(m=>m.id)));

  if(cfg.resenas)RESE=cfg.resenas;
  else faltantes.push(saveConfig('resenas',RESE));

  if(cfg.mejoras)MEJ=cfg.mejoras;
  else faltantes.push(saveConfig('mejoras',MEJ));

  if(cfg.recomendaciones)RECO=cfg.recomendaciones;
  else faltantes.push(saveConfig('recomendaciones',RECO));

  await Promise.all(faltantes);

  document.getElementById('loading').style.display='none';
  document.getElementById('login').style.display='block';
  pLogin();
 }catch(err){
  console.error(err);
  document.getElementById('loadMsg').style.display='none';
  document.querySelector('#loading .spin').style.display='none';
  document.getElementById('loadErr').style.display='block';
 }
}
init();
</script>
